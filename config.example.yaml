# Copy this file to config.yaml and edit it for your setup.
# config.yaml is gitignored. Secrets belong in .env, not here — reference them
# as ${VAR} (see the password fields below and .env.example).

# ---------------------------------------------------------------------------
# Cameras
# ---------------------------------------------------------------------------
# Each camera can be reached two ways — use whichever is convenient:
#   * Through an NVR  host = NVR IP,     channel = the camera's NVR channel
#                    (one host + one credential for every camera; also needed
#                    if cameras sit on the NVR's isolated PoE network)
#   * Directly       host = camera IP,  channel = 0
#                    (no NVR dependency; also the only way to reach a lens the
#                    NVR doesn't expose, e.g. a dual-lens camera's 2nd lens)
#
# Both return the same full-resolution main-stream snapshot on current gear
# (verified on an RLN36). Some older NVRs may return a reduced-res snapshot —
# if you see that, pull that camera directly.
#
# `name` is used in folder/file names — letters, digits and dashes only.
cameras:
  - name: front-yard
    host: 192.168.1.50        # camera IP, or NVR IP
    channel: 0                # 0 talking to a camera directly; NVR channel otherwise
    username: admin
    password: "${REOLINK_PASSWORD}"
    https: true               # older firmware may only offer http (set false)
    verify_ssl: false         # Reolink ships self-signed certs; keep false for https

  # Example: a second camera pulled from the same NVR on channel 1
  # - name: back-yard
  #   host: 192.168.1.50
  #   channel: 1
  #   username: admin
  #   password: "${REOLINK_PASSWORD}"
  #   https: true
  #   verify_ssl: false
  #   include_events_in_daily: true   # keep this camera's storm-burst frames in
  #                                   # its daily video, whatever daily_video.
  #                                   # include_events says. Leave the key out to
  #                                   # follow the global setting.

  # Example: an auto-tracking PTZ camera. Frames captured while it is away
  # from its home position are quarantined (kept, but excluded from videos).
  # Find the pan/tilt values by pointing it home and querying GetPtzCurPos.
  # - name: driveway
  #   host: 192.168.1.51
  #   channel: 0
  #   username: admin
  #   password: "${REOLINK_PASSWORD}"
  #   https: true
  #   verify_ssl: false
  #   ptz_home:
  #     channel: 0            # queried host defaults to the camera's own host;
  #     host: 192.168.1.51    # set explicitly (camera IP) if you need the tilt
  #     pan: 1071             # axis — an NVR only relays pan
  #     # tilt: 79
  #     tolerance: 10

  # Example: a night camera in an otherwise daytime setup — say a yard camera
  # watching for nocturnal animals, or one framing a moonrise. Any key left out
  # falls back to capture.daylight_window below, and a camera can enable its own
  # window even when the global one is off (or opt out when it is on).
  # - name: wildlife
  #   host: 192.168.1.52
  #   channel: 0
  #   username: admin
  #   password: "${REOLINK_PASSWORD}"
  #   https: true
  #   verify_ssl: false
  #   interval_seconds: 300   # slower than the global rate — covering the dark
  #                           # hours roughly doubles a camera's capture time, so
  #                           # this is the simplest way to hold disk use flat
  #   daylight_window:
  #     enabled: true
  #     mode: night           # capture the dark hours only; the night spans
  #                           # midnight and builds as ONE video at dawn
  #     buffer_minutes: 30    # trim 30 min of twilight off each end

  # Example: a camera the weather isn't visible from — indoors, a doorway, a
  # tight framing. events_enabled: false makes it ignore events entirely: it
  # holds its own interval instead of speeding up to burst_interval_seconds
  # during a storm, and no event clips are built from its frames. Its frames
  # are still tagged, so the metadata stays complete. Defaults to true; leave
  # the key out for a camera that should participate normally.
  # - name: front-door
  #   host: 192.168.1.50
  #   channel: 3
  #   username: admin
  #   password: "${REOLINK_PASSWORD}"
  #   https: true
  #   verify_ssl: false
  #   events_enabled: false

capture:
  timezone: ""                # IANA name (e.g. "America/Chicago") for capture
                              # timing and day boundaries. Empty = auto-detect
                              # from events.zip / latitude+longitude below,
                              # falling back to the host system clock. Set this
                              # (or a location) so a misconfigured host clock
                              # can't split your days at the wrong hour.
  interval_seconds: 60        # one frame/minute -> ~48s daily video at 30 fps.
                              # Minimum 10s — faster polling can overload the
                              # camera/NVR (clamped, and rejected by the web UI).
                              # Any camera may override this with its own
                              # interval_seconds (see the wildlife example above).
  start_time: ""              # e.g. "05:30" to skip night frames; empty = all day
  end_time: ""                # e.g. "21:30". Ignored if daylight_window.enabled
  timeout_seconds: 15
  daylight_window:            # capture only around actual daylight, computed
                              # daily from sunrise/sunset instead of a fixed
                              # clock window — see the README section on IR
                              # and 24-hour timelapses for why this matters.
                              # Applies to every camera that doesn't set its own
                              # daylight_window (see the wildlife example above).
    enabled: false            # overrides start_time/end_time when true
    mode: day                 # "day" captures the daylight window; "night"
                              # captures its complement (dark hours). A night
                              # spans midnight and is stored as ONE video (its
                              # frames bucket by a noon-to-noon day). In night
                              # mode the capture service builds each night ~5
                              # min after the dawn window closes, not on the
                              # nightly timer.
    buffer_minutes: 0         # day mode: start this many minutes before sunrise,
                              # stop this many after sunset. Night mode: the
                              # inverse — trims that many minutes of twilight off
                              # each end of the night. Uses the same location as
                              # events.zip/latitude/longitude below.

storage:
  root: ./data                # relative paths resolve next to config.yaml
  keep_snapshots_days: 4      # prune a day's frames this many days after its
                              # daily video is built; 0 = keep frames forever

daily_video:
  fps: 30
  crf: 20                     # x264 quality; lower = better/bigger (18-23 sensible)
  preset: medium               # x264 encode speed vs. compression: ultrafast,
                              # superfast, veryfast, faster, fast, medium
                              # (default), slow, slower, veryslow. Slower =
                              # smaller file at the same crf, more CPU time.
  deflicker_size: 10          # frames in the deflicker averaging window; 0 disables
  max_height: 1440            # downscale taller sources; 0 = keep original height
  retention_days: 0           # delete a camera's daily .mp4 this many days after
                              # its date; 0 = keep forever. Unlike snapshots, a
                              # pruned daily video is NOT re-buildable — its
                              # source frames are already gone by then too.
  include_events: false       # weave storm/snow BURST frames into the daily
                              # video. While a burst tag is active, capture drops
                              # to events.burst_interval_seconds, so those minutes
                              # land in the day folder far denser than the rest of
                              # the day and the daily video crawls through them.
                              # false (default) leaves frames inside an active
                              # burst span out of the daily .mp4 ONLY — the event
                              # clip, the yearly frame archive, and the frames on
                              # disk are all untouched. Any camera may override
                              # this with include_events_in_daily.

yearly:
  min_days_before_render: 30  # wait until this many distinct days have been
                              # archived before rendering the yearly video — a
                              # couple of days is a pointless ~2s clip. 0 renders
                              # as soon as any frames exist; `yearly --force`
                              # overrides it for a one-off early build.
  archive_frames_per_day: 24  # frames kept forever per day; the pool the yearly
                              # video is rendered from (archive more than you render)
  video_frames_per_day: 10    # 10/day x 365 @ 30 fps ~= a 2-minute year
  video_window: "08:00-16:30" # render only daylight hours; "" = whole day
  fps: 30
  crf: 20
  preset: medium               # see daily_video.preset above
  deflicker_size: 15          # wider window: day-to-day exposure varies more
  retention_years: 0          # delete a camera's yearly .mp4 once it's more than
                              # this many years old; 0 = keep forever. Cheap to
                              # set low: the archived frames it's built from are
                              # NEVER deleted, so `build_timelapse.py yearly
                              # --year YYYY` regenerates a pruned year any time.

# ---------------------------------------------------------------------------
# Weather & lunar event tagging (optional)
# ---------------------------------------------------------------------------
# Two independent switches — turn on either, both, or neither:
#
#   weather_enabled  Polls NWS alerts (US-only) + Open-Meteo for storm/snow/
#                    rain, triggers burst capture. REQUIRES a location: set
#                    `zip`, or `latitude`/`longitude` (required outside the
#                    US). If enabled without one, storm/snow tagging is
#                    silently skipped and a warning is logged — the web UI
#                    also flags this.
#
#   lunar_enabled    Computes real moon events locally with Skyfield: full,
#                    blue, and harvest moon, plus blood moon (total lunar
#                    eclipse) and partial lunar eclipse. NO location required
#                    — moon phase is the same instant everywhere on Earth.
#                    A location, if set, is used to only tag an eclipse when
#                    the Moon was actually above your horizon (eclipses are
#                    geocentric events, but visibility is not — a total
#                    eclipse invisible from the southern hemisphere, say,
#                    still fires the phase math without one). First use
#                    downloads a ~17 MB ephemeris into <storage.root>/ephemeris.
#
#   season_enabled   Tags every frame and video with the current astronomical
#                    season (spring/summer/fall/winter). NO location required
#                    — defaults to Northern Hemisphere; set a location to get
#                    the correct season south of the equator. Cheap and
#                    useful for a project literally about the changing
#                    seasons — reasonable to leave on.
#
# Active tags are logged (data/conditions/) and embedded in each frame; video
# metadata gets the season too (readable with ffprobe/exiftool).
events:
  weather_enabled: false
  lunar_enabled: false
  season_enabled: false
  zip: "12345"                # US ZIP, resolved to lat/lon via zippopotam.us
                              # (free, no key). Or set latitude/longitude
                              # below to skip the lookup.
  # latitude: 0.0
  # longitude: 0.0
  poll_minutes: 5
  burst_tags: [storm, snow]   # tags that switch capture to the burst interval
  burst_interval_seconds: 10  # use a value that divides interval_seconds
  # force_tags: [storm]       # testing hook: pretend these are always active

  # Storm detection thresholds. Open-Meteo's weather code reports thunderstorm
  # (WMO 95/96/99) far less often than thunderstorms happen — a storm downpour
  # usually comes back as "rain showers" — so `storm` is also inferred from the
  # physical fields. Raise these to tag fewer storms, lower to tag more.
  storm_cape_min: 800         # J/kg of convective energy that, TOGETHER with
                              # falling rain, counts as a storm. CAPE alone is
                              # only potential — it can sit above 2000 under a
                              # clear sky — so it never tags on its own.
  storm_precip_mm: 0.1        # mm in the reporting interval = "actually raining"
  storm_gust_kmh: 60          # gusts this strong tag a storm on their own, wet
                              # or dry — that's a squall/gust front worth having
  stale_grace_minutes: 15     # if a weather API times out (these free services
                              # hand out 502/503s regularly), keep its last known
                              # tags this long instead of reading the outage as
                              # "all clear". Stops a blip ending a burst
                              # mid-storm. Default: 3 polls.

  # The web UI's Forecast tab — upcoming storms, snow, and moon events. It is
  # read-only and never affects capture. The same thresholds above decide what
  # counts as a forecast storm, so what it predicts agrees with what actually
  # gets tagged. Weather needs a location; moon events need none.
  forecast_days: 10           # how far ahead the Forecast tab looks, 1-10.
                              # Open-Meteo reaches 10 days; the NWS forecast
                              # used to corroborate it only reaches about 7, so
                              # days 8-10 rest on a single model and say so.
  forecast_snow_cm_min: 0.5   # cm of snow across a day before it's worth
                              # showing. A dusting that melts on contact makes
                              # a dull timelapse; this is roughly "you can see
                              # it settling".

events_video:
  tags: [storm, snow]         # render a clip per active span of these tags
  min_seconds: 5               # every tagged span gets a clip, even a brief
                              # one — but a span shorter than this gets padded
                              # with extra frames from around the event so the
                              # clip is never just a couple of frames long.
                              # Translated to a frame count via fps below. The
                              # pre-0.4 key `min_frames` is still honored if
                              # this is absent, so an existing config.yaml
                              # keeps behaving exactly as it did; the Config
                              # page migrates min_frames -> min_seconds for you.
  gap_minutes: 20              # two spans of the same tag closer together
                              # than this render as one clip instead of two.
                              # Also decides which frames the daily video
                              # excludes when daily_video.include_events is
                              # off, so the two always agree.
  # gap_minutes_by_tag:       # per-tag override — e.g. a slower-moving snow
  #   snow: 45                # event can tolerate a longer lull than a storm
  #   storm: 15                # before it's treated as a separate event
  fps: 30
  crf: 20
  preset: medium               # see daily_video.preset above
  deflicker_size: 0           # default for any tag not in deflicker_by_tag
                              # below. Off by default: deflicker would smooth
                              # away lightning flashes in storm clips.
  # deflicker_by_tag:         # per-tag override — e.g. snow has no lightning
  #   snow: 10                # to protect, so smoothing exposure flicker is
  #                           # safe (and often looks better) there
  retention_days: 0           # delete an event clip this many days after its
                              # date (parsed from the filename); 0 = forever

webapp:
  host: 0.0.0.0
  port: 8080
  accent_color: amber         # amber (default) / green / blue / red / purple / yellow
  # Optional passcode gate for the Config page (video browsing stays open).
  # Don't set this by hand — use the "Config page access" section on the
  # Config page, which stores a salted scrypt hash here as:
  #   config_passcode_hash: "scrypt$...$...$..."
  # Leave it out (or remove it from the Config page) to keep the app fully open.
