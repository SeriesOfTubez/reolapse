<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReoLapse</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<style>
  :root {
    /* Surfaces */
    --surface-0: #14161a;
    --surface-1: #1d2026;
    --surface-2: #24282f;
    /* Borders */
    --border: #30343c;
    --border-strong: #3d424c;
    /* Text */
    --text-1: #e8eaed;
    --text-2: #9aa0a8;
    --text-3: #6b7280;
    /* Brand accent, from the logo's sun */
    --accent: #f2a94e;
    --accent-strong: #f79a3e;
    --accent-contrast: #14161a;
    --accent-quiet: rgba(242, 169, 78, 0.14);
    /* Typography */
    --font-sans: system-ui, "Segoe UI", Roboto, sans-serif;
    --fs-xs: 12px;
    --fs-sm: 13px;
    --fs-base: 15px;
    --fs-lg: 17px;
    --lh: 1.5;
    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    /* Spacing scale */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    /* Radii */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --radius-pill: 999px;
    /* Motion & layout */
    --transition: 120ms ease;
    --sidebar-w: 260px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-1);
    font: var(--fs-base)/var(--lh) var(--font-sans);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--space-4);
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; }
  .brand:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .brand img { width: 26px; height: 26px; display: block; }
  .brand h1 {
    margin: 0;
    font-size: var(--fs-lg);
    font-weight: var(--fw-semibold);
    letter-spacing: 0.2px;
  }
  .brand .version {
    color: var(--text-3); font-size: var(--fs-xs); align-self: flex-end;
    margin-bottom: 3px; text-decoration: none;
  }
  /* The version link sits inside the clickable .brand "go home" region —
     stop its own click from bubbling up and re-triggering that navigation
     (see the version anchor's own click handler in the script). */
  .brand .version:hover { text-decoration: underline; color: var(--accent); }
  .build-indicator { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--accent); white-space: nowrap; }
  .build-indicator[hidden] { display: none; }

  /* margin-left: auto pins this to the far right of the header regardless of
     how much else is in the flex row (camera count, pill count, etc.) */
  .help-menu { position: relative; margin-left: auto; }
  .help-btn {
    width: 26px; height: 26px; border-radius: var(--radius-pill);
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-2); font: var(--fw-medium) var(--fs-sm)/1 var(--font-sans);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0; transition: color var(--transition), border-color var(--transition);
  }
  .help-btn:hover, .help-btn[aria-expanded="true"] { color: var(--text-1); border-color: var(--border-strong); }
  .help-dropdown {
    position: absolute; top: calc(100% + var(--space-2)); right: 0;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: var(--space-1);
    display: flex; flex-direction: column; min-width: 170px; z-index: 20;
  }
  .help-dropdown[hidden] { display: none; }
  .help-dropdown a {
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
    color: var(--text-2); text-decoration: none; font-size: var(--fs-sm);
  }
  .help-dropdown a:hover { background: var(--surface-2); color: var(--text-1); }
  .build-spin { width: 10px; height: 10px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; display: inline-block; animation: build-spin 0.8s linear infinite; }
  @keyframes build-spin { to { transform: rotate(360deg); } }

  .pills { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .pill {
    padding: var(--space-1) var(--space-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface-1);
    color: var(--text-2);
    font: var(--fw-regular) var(--fs-sm)/1 var(--font-sans);
    cursor: pointer;
    transition: color var(--transition), background var(--transition), border-color var(--transition);
  }
  .pill:hover { color: var(--text-1); border-color: var(--border-strong); }
  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: var(--fw-medium);
  }

  .nav-group { display: flex; align-items: center; gap: var(--space-2); }
  .nav-label { color: var(--text-3); font-size: var(--fs-xs); }
  .cam-select, .view-select {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius-pill); color: var(--text-2);
    font: var(--fw-regular) var(--fs-sm)/1 var(--font-sans);
    padding: var(--space-1) var(--space-3); cursor: pointer;
    transition: color var(--transition), border-color var(--transition);
  }
  .cam-select:hover, .view-select:hover { color: var(--text-1); border-color: var(--border-strong); }
  .cam-select:focus, .view-select:focus { outline: 1px solid var(--accent); }
  .cam-select:disabled { color: var(--text-3); cursor: not-allowed; opacity: 0.6; }
  .cam-select option, .view-select option { background: var(--surface-1); color: var(--text-1); }

  main { flex: 1; display: flex; min-height: 0; }

  #content-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  #cfg-footer {
    display: none;
    flex-shrink: 0;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-5);
    border-top: 1px solid var(--border);
    background: var(--surface-0);
  }
  #cfg-footer.visible { display: flex; }

  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: var(--space-2);
  }
  .vid-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
  }
  .vid-item:hover { background: var(--surface-1); }
  .vid-item.active { background: var(--accent-quiet); color: var(--accent); }
  .vid-item .size { color: var(--text-2); font-size: var(--fs-xs); white-space: nowrap; }

  .year-group, .month-group { border: none; }
  .year-group > summary, .month-group > summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    cursor: pointer;
    list-style: none;
    color: var(--text-1);
    font-weight: var(--fw-medium);
  }
  .year-group > summary::-webkit-details-marker,
  .month-group > summary::-webkit-details-marker { display: none; }
  .year-group > summary:hover, .month-group > summary:hover { background: var(--surface-1); }
  .year-group > summary::before {
    content: "\25B8";
    display: inline-block;
    margin-right: var(--space-2);
    color: var(--text-3);
    transition: transform var(--transition);
  }
  .year-group[open] > summary::before { transform: rotate(90deg); }
  .month-group { margin-left: var(--space-2); }
  .month-group > summary {
    font-size: var(--fs-sm);
    font-weight: var(--fw-regular);
    color: var(--text-2);
  }
  .month-group > summary::before {
    content: "\25B8";
    display: inline-block;
    margin-right: var(--space-2);
    font-size: var(--fs-xs);
    transition: transform var(--transition);
  }
  .month-group[open] > summary::before { transform: rotate(90deg); }
  .month-group .vid-item { margin-left: var(--space-4); }
  .group-count { color: var(--text-3); font-size: var(--fs-xs); font-weight: var(--fw-regular); }

  #player-area {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* flex-start, not center: with overflow-y:auto, justify-content:center
       pushes overflowing content's start edge out of scroll range - tall
       views (Config, Storage) would have their top clipped and unreachable
       by scrolling. Content shorter than the viewport (the video player) is
       centered instead via margin:auto on .video-wrap below, which doesn't
       have that bug. */
    justify-content: flex-start;
    padding: var(--space-5);
    overflow-y: auto;
  }
  .video-wrap { margin: auto 0; display: flex; flex-direction: column; align-items: center; }
  #empty { margin: auto; }
  video {
    max-width: 100%;
    max-height: calc(100% - 60px);
    border-radius: var(--radius-lg);
    background: #000;
  }

  #controls {
    margin-top: var(--space-3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }
  #controls .label { color: var(--text-2); font-size: var(--fs-sm); }
  .speed {
    padding: var(--space-1) var(--space-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-1);
    color: var(--text-2);
    font: var(--fw-regular) var(--fs-xs)/1 var(--font-sans);
    cursor: pointer;
    transition: color var(--transition), border-color var(--transition);
  }
  .speed:hover { color: var(--text-1); border-color: var(--border-strong); }
  .speed.active { color: var(--accent); border-color: var(--accent); }
  a.dl { color: var(--text-2); font-size: var(--fs-sm); text-decoration: none; }
  a.dl:hover { color: var(--accent); }
  button.del {
    background: none; border: 0; padding: 0;
    color: var(--text-2); font: inherit; font-size: var(--fs-sm);
    cursor: pointer;
  }
  button.del:hover { color: #e5534b; }

  #empty { color: var(--text-2); text-align: center; padding: var(--space-6); line-height: 1.6; }
  #empty code {
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    font-size: var(--fs-sm);
  }

  #warnings:empty { display: none; }
  .warning {
    padding: var(--space-2) var(--space-5);
    background: var(--accent-quiet);
    color: var(--accent);
    font-size: var(--fs-sm);
    border-bottom: 1px solid var(--border);
  }

  #storage-view { width: 100%; max-width: 760px; }
  .forecast-banner {
    margin: var(--space-4) 0;
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-1);
  }
  .forecast-title { font-size: 16px; font-weight: var(--fw-semibold); margin-bottom: var(--space-1); }
  .forecast-detail { color: var(--text-2); font-size: var(--fs-sm); }
  .forecast-runway { border-color: var(--accent); }
  .forecast-runway .forecast-title { color: var(--accent); }
  .forecast-excess { border-color: #4caf7d; }
  .forecast-excess .forecast-title { color: #4caf7d; }
  .forecast-shortage { border-color: #e5534b; }
  .forecast-shortage .forecast-title { color: #e5534b; }
  .retention-line { color: var(--text-2); font-size: var(--fs-xs); margin-bottom: var(--space-2); }
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: var(--space-3);
  }
  .stat-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4);
  }
  .stat-label { color: var(--text-2); font-size: var(--fs-xs); }
  .stat-value {
    font-size: 22px;
    font-weight: var(--fw-semibold);
    margin: var(--space-1) 0;
  }
  .stat-sub { color: var(--text-2); font-size: var(--fs-xs); }
  .stat-projection {
    margin: var(--space-4) 0;
    color: var(--text-2);
    font-size: var(--fs-sm);
  }
  .stat-projection strong { color: var(--text-1); font-weight: var(--fw-medium); }
  .stat-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .stat-table th, .stat-table td {
    text-align: left;
    padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--border);
  }
  .stat-table th { color: var(--text-2); font-weight: var(--fw-regular); }
  .stat-footnote {
    margin-top: var(--space-3);
    color: var(--text-3);
    font-size: var(--fs-xs);
  }

  /* --- Forecast tab -------------------------------------------------- */
  #forecast-view { width: 100%; max-width: 760px; }
  .fc-head { margin-bottom: var(--space-4); }
  .fc-title { font-size: var(--fs-lg); font-weight: var(--fw-semibold); }
  .fc-sub { color: var(--text-2); font-size: var(--fs-sm); margin-top: var(--space-1); }
  .fc-note {
    margin-bottom: var(--space-3);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm);
    background: var(--accent-quiet);
    color: var(--accent);
    font-size: var(--fs-sm);
  }
  .fc-days { display: flex; flex-direction: column; gap: var(--space-2); }

  .fc-day {
    background: var(--surface-1);
    border: 1px solid var(--border);
    /* Lead time is encoded on this edge — see .lead-* below. */
    border-left-width: 3px;
    border-radius: var(--radius-md);
  }
  .fc-day > summary {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    cursor: pointer;
    list-style: none;
  }
  .fc-day > summary::-webkit-details-marker { display: none; }
  .fc-day > summary:hover { background: var(--surface-2); border-radius: var(--radius-md); }
  .fc-day[open] > summary { border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .fc-day.quiet {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-2) var(--space-4);
    background: none;
    color: var(--text-3);
  }
  .fc-date { min-width: 108px; font-size: var(--fs-sm); font-weight: var(--fw-medium); }
  .fc-date b { color: var(--text-1); }
  .fc-day.quiet .fc-date { font-weight: var(--fw-regular); }
  .fc-when { min-width: 76px; color: var(--text-3); font-size: var(--fs-xs); }
  .fc-nothing { color: var(--text-3); font-size: var(--fs-xs); }
  .fc-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); flex: 1; }

  /* Confidence is carried by this border: near days read solid, far days
     faint. Deliberately the ONLY invented signal — everything numeric on the
     card comes straight from the forecast APIs. */
  .fc-day.lead-near { border-left-color: var(--accent); }
  .fc-day.lead-mid  { border-left-color: var(--border-strong); }
  .fc-day.lead-far  { border-left-color: var(--border); }

  .fc-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 3px var(--space-3);
    border-radius: var(--radius-pill);
    font-size: var(--fs-xs);
    border: 1px solid var(--border-strong);
    white-space: nowrap;
  }
  .fc-chip .pct { font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; }
  .fc-chip-storm { border-color: #e5a34b; color: #f0b86a; background: rgba(229, 163, 75, 0.12); }
  .fc-chip-snow  { border-color: #7fb6e8; color: #9ccbf2; background: rgba(127, 182, 232, 0.12); }
  /* Moon events are computed, not predicted — a filled chip with no
     percentage, so they never read as "probably". */
  .fc-chip-moon {
    border-color: #c9cdd4; color: var(--surface-0);
    background: #c9cdd4; font-weight: var(--fw-medium);
  }

  .fc-body {
    padding: 0 var(--space-4) var(--space-3) var(--space-4);
    border-top: 1px solid var(--border);
    padding-top: var(--space-3);
  }
  .fc-event { font-size: var(--fs-sm); margin-bottom: var(--space-3); }
  .fc-event:last-child { margin-bottom: 0; }
  .fc-event-head { font-weight: var(--fw-medium); margin-bottom: var(--space-1); }
  .fc-event-line { color: var(--text-2); font-size: var(--fs-xs); }
  .fc-meter {
    height: 4px;
    border-radius: 2px;
    background: var(--surface-2);
    margin: var(--space-2) 0;
    max-width: 240px;
    overflow: hidden;
  }
  .fc-meter > span { display: block; height: 100%; background: var(--accent); }
  .fc-agree { color: var(--text-2); font-size: var(--fs-xs); }
  .fc-certain { color: #c9cdd4; font-size: var(--fs-xs); }
  .fc-footnote { margin-top: var(--space-4); color: var(--text-3); font-size: var(--fs-xs); }

  #cfg-view { width: 100%; max-width: 720px; }
  .cfg-section {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .cfg-section h3 {
    margin: 0 0 var(--space-3) 0;
    font-size: var(--fs-base);
    font-weight: var(--fw-semibold);
  }
  .cfg-section .cfg-hint-block {
    color: var(--text-2);
    font-size: var(--fs-xs);
    margin-bottom: var(--space-3);
    line-height: 1.5;
  }
  /* Nested group inside a camera card (e.g. its capture schedule). */
  .cfg-subsection {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    margin-top: var(--space-3);
  }
  .cfg-subsection h4 {
    margin: 0 0 var(--space-2) 0;
    font-size: var(--fs-sm);
    font-weight: var(--fw-semibold);
  }
  .cfg-subsection .cfg-hint-block {
    color: var(--text-2);
    font-size: var(--fs-xs);
    margin-bottom: var(--space-2);
    line-height: 1.5;
  }
  .sensitivity-slider { width: 100%; accent-color: var(--accent); margin-bottom: var(--space-1); }
  .sensitivity-caption { font-size: var(--fs-xs); color: var(--text-2); margin-bottom: var(--space-3); }
  .is-custom .sensitivity-caption { color: var(--text-3); }
  .cfg-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--border);
  }
  .cfg-row:last-child { border-bottom: none; }
  .cfg-row.cfg-row-col { flex-direction: column; align-items: stretch; gap: var(--space-1); }
  .cfg-label { font-size: var(--fs-sm); color: var(--text-1); flex: 1 1 auto; min-width: 0; }
  .cfg-hint { display: block; color: var(--text-3); font-size: var(--fs-xs); margin-top: 2px; }
  .cfg-row input[type="text"],
  .cfg-row input[type="number"],
  .cfg-row select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-1);
    font: var(--fw-regular) var(--fs-sm)/1 var(--font-sans);
    padding: var(--space-1) var(--space-2);
    width: 200px;
    max-width: 50%;
    flex-shrink: 0;
  }
  .cfg-row input[type="checkbox"] { flex-shrink: 0; margin-top: 2px; }
  .cfg-row.cfg-row-col input[type="text"],
  .cfg-row.cfg-row-col select { width: 100%; max-width: 100%; }
  .tz-field { display: flex; flex-direction: column; gap: var(--space-2); }
  .tz-manual-toggle { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); cursor: pointer; }
  .tz-manual-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .tz-field select, .tz-field input[type="text"] {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-1); font: var(--fw-regular) var(--fs-sm)/1 var(--font-sans);
    padding: var(--space-1) var(--space-2); width: 100%; max-width: 340px;
  }
  .tz-field input[disabled] { color: var(--text-3); cursor: not-allowed; }
  .cfg-row input:focus, .cfg-row select:focus { outline: 1px solid var(--accent); }
  .cfg-row input[readonly] { color: var(--text-3); cursor: not-allowed; }
  .cfg-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .cfg-radio-group { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .cfg-radio-group label { display: flex; align-items: center; gap: var(--space-1); font-size: var(--fs-sm); cursor: pointer; }
  .cfg-check-group { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .cfg-check-group label { display: flex; align-items: center; gap: var(--space-1); font-size: var(--fs-sm); cursor: pointer; }
  .swatch-radio { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .swatch-radio label {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 4px 10px 4px 6px; border-radius: var(--radius-pill);
    border: 1px solid var(--border); font-size: var(--fs-sm);
  }
  .swatch-radio input { accent-color: currentColor; }
  .swatch-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

  .cfg-tabs { margin-bottom: var(--space-4); }

  .cfg-camera-picker-row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }

  .cfg-camera-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-3);
    margin-bottom: var(--space-3);
  }
  .cfg-camera-card:last-child { margin-bottom: 0; }
  .cfg-camera-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2); }
  .cfg-camera-head strong { font-size: var(--fs-sm); }
  .cfg-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-1);
    font-size: var(--fs-xs);
    padding: 4px 10px;
    cursor: pointer;
  }
  .cfg-btn:hover { border-color: var(--border-strong); }
  .cfg-btn.cfg-btn-danger { color: #e5534b; }
  .cfg-btn.cfg-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: var(--fw-medium); }

  .cfg-msg { font-size: var(--fs-sm); }
  .cfg-msg.ok { color: #4caf7d; }
  .cfg-msg.error { color: #e5534b; }

  .cfg-login-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-2); }
  .cfg-login-row input[type="password"] {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-1);
    font: var(--fw-regular) var(--fs-sm)/1 var(--font-sans);
    padding: var(--space-1) var(--space-2);
    width: 200px;
  }
  .cfg-login-row input[type="password"]:focus { outline: 1px solid var(--accent); }
  .cfg-section.cfg-login { max-width: 520px; }

  .cfg-discover-list { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-2); }
  .cfg-discover-item {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
  }
  .cfg-discover-row { display: flex; justify-content: space-between; align-items: center; }
  .cfg-discover-detail { margin-top: var(--space-2); display: none; }
  .cfg-discover-detail.open { display: block; }
  .cfg-discover-detail input { margin-right: var(--space-2); margin-bottom: var(--space-2); }

  @media (max-width: 700px) {
    main { flex-direction: column; }
    #sidebar {
      width: 100%;
      max-height: 40%;
      border-right: none;
      border-top: 1px solid var(--border);
      order: 2;
    }
    #content-col { order: 1; }

    /* The forecast summary row is date + relative day + chips, which needs
       more than a phone's width. Let it wrap onto a second line and drop the
       alignment columns, rather than overflow the card. */
    .fc-day > summary, .fc-day.quiet { flex-wrap: wrap; }
    .fc-date { min-width: 0; }
    .fc-when { min-width: 0; }
    .fc-chips { flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand" id="home-link" role="button" tabindex="0" title="Back to Daily videos">
    <img src="/static/logo.svg" alt="">
    <h1>ReoLapse</h1>
    <a class="version" id="version" target="_blank" rel="noopener noreferrer"></a>
  </div>
  <div class="nav-group">
    <label class="nav-label" for="camera-select">Camera</label>
    <span id="camera-picker"></span>
    <select id="view-select" class="view-select">
      <option value="daily">Daily</option>
      <option value="yearly">Yearly</option>
      <option value="events">Events</option>
    </select>
  </div>
  <div class="pills" id="types">
    <button class="pill" data-type="forecast">Forecast</button>
    <button class="pill" data-type="storage">Storage</button>
    <button class="pill" data-type="config">Config</button>
  </div>
  <div class="build-indicator" id="build-indicator" hidden></div>
  <div class="help-menu">
    <button id="help-btn" class="help-btn" aria-haspopup="true" aria-expanded="false" title="Help &amp; feedback">?</button>
    <div class="help-dropdown" id="help-dropdown" hidden>
      <a href="https://github.com/SeriesOfTubez/reolapse/wiki" target="_blank" rel="noopener noreferrer">Wiki</a>
      <a href="https://github.com/SeriesOfTubez/reolapse/issues" target="_blank" rel="noopener noreferrer">Report an issue</a>
      <a href="https://github.com/SeriesOfTubez/reolapse/discussions" target="_blank" rel="noopener noreferrer">Discussions</a>
    </div>
  </div>
</header>
<div id="warnings"></div>
<main>
  <div id="sidebar"></div>
  <div id="content-col">
    <div id="player-area">
      <div id="empty">Loading&hellip;</div>
    </div>
    <div id="cfg-footer"></div>
  </div>
</main>
<script>
let state = { videos: [], cameras: [], camera: null, type: "daily",
              lastVideoView: "daily", current: null,
              configTab: "app", configCameraIndex: 0 };

async function load() {
  const res = await fetch("/api/videos");
  const data = await res.json();
  state.videos = data.videos;
  if (data.version) {
    const v = document.getElementById("version");
    if (v) {
      v.textContent = "v" + data.version;
      v.href = `https://github.com/SeriesOfTubez/reolapse/releases/tag/v${data.version}`;
    }
  }

  const warnBox = document.getElementById("warnings");
  warnBox.innerHTML = "";
  (data.warnings || []).forEach(w => {
    const div = document.createElement("div");
    div.className = "warning";
    div.textContent = w;
    warnBox.appendChild(div);
  });
  checkForUpdate();

  // Keep the currently-selected camera across a refresh (e.g. the poll that
  // fires when a nightly build finishes) instead of always snapping back to
  // cameras[0] — only fall back when the current selection no longer exists
  // (a genuinely new list, or the first load with none selected yet).
  state.cameras = data.cameras || [];
  if (!state.cameras.includes(state.camera)) state.camera = state.cameras[0] || null;
  mountCameraPicker();
  refresh();
}

function setActive(container, btn) {
  container.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
}

// --- Shared UI components ---

// A <select> of cameras, used identically by the navbar and (Feature C) the
// Config page's Cameras tab. opts.cameras accepts plain name strings (the
// navbar's case — GET /api/videos derives its list from videos on disk) or
// {value, label} objects (the Config page's case — index-based, fed from
// state.configData.cameras). The two lists are deliberately not unified: a
// newly added camera with no videos yet exists in one and not the other.
function cameraPicker(opts) {
  opts = opts || {};
  const select = document.createElement("select");
  select.className = "cam-select";
  if (opts.id) select.id = opts.id;
  if (opts.ariaLabel) select.setAttribute("aria-label", opts.ariaLabel);

  const entries = (opts.cameras || []).map(c =>
    (typeof c === "string") ? {value: c, label: c} : c);

  if (!entries.length) {
    const o = document.createElement("option");
    o.disabled = true;
    o.selected = true;
    o.textContent = opts.emptyLabel || "No cameras";
    select.appendChild(o);
    select.disabled = true;
  } else {
    entries.forEach(entry => {
      const o = document.createElement("option");
      o.value = entry.value;
      o.textContent = entry.label;
      if (String(entry.value) === String(opts.selected)) o.selected = true;
      select.appendChild(o);
    });
    // No option matched opts.selected: leave none marked `selected`, so the
    // browser's native default (first option) applies.
  }

  select.onchange = () => { if (opts.onSelect) opts.onSelect(select.value); };

  if (opts.disabled) {
    select.disabled = true;
    select.title = opts.disabledTitle || "";
  }

  return select;
}

// (Re)builds the navbar's camera <select> from state.cameras/state.camera,
// then syncs the rest of the nav to match (view-select value, disabled
// state, active pills).
function mountCameraPicker() {
  const mount = document.getElementById("camera-picker");
  if (!mount) return;
  mount.innerHTML = "";
  mount.appendChild(cameraPicker({
    id: "camera-select",
    ariaLabel: "Camera",
    cameras: state.cameras,
    selected: state.camera,
    emptyLabel: "No cameras with videos yet",
    onSelect: value => { state.camera = value; refresh(); },
  }));
  syncNav();
}

// Keeps the header's controls consistent with state.type: the view <select>
// shows the last video view even while a camera-independent tab is open, the
// camera picker is disabled (but left visible, with an explanatory tooltip)
// on those tabs since they never read state.camera, and exactly one #types
// pill is active only when state.type is itself one of those tabs.
function syncNav() {
  const viewSelect = document.getElementById("view-select");
  if (viewSelect) viewSelect.value = state.lastVideoView;

  const camSelect = document.getElementById("camera-select");
  if (camSelect) {
    const independent = !VIDEO_VIEWS.includes(state.type);
    camSelect.disabled = independent || !state.cameras.length;
    camSelect.title = independent ? "This view isn't camera-specific" : "";
  }

  document.querySelectorAll("#types .pill").forEach(p => {
    p.classList.toggle("active", p.dataset.type === state.type);
  });
}

function refresh() {
  if (state.type !== "config") {
    document.getElementById("cfg-footer").classList.remove("visible");
  }
  if (state.type === "storage") renderStorage();
  else if (state.type === "forecast") renderForecast();
  else if (state.type === "config") renderConfig();
  else renderList();
}

document.getElementById("view-select").addEventListener("change", e => {
  state.type = e.target.value;
  state.lastVideoView = e.target.value;
  syncNav();
  refresh();
});

document.getElementById("types").addEventListener("click", e => {
  if (!e.target.dataset.type) return;
  state.type = e.target.dataset.type;
  setActive(document.getElementById("types"), e.target);
  syncNav();
  refresh();
});

function goHome() {
  state.type = "daily";
  state.lastVideoView = "daily";
  syncNav();
  refresh();
}
const homeLink = document.getElementById("home-link");
homeLink.addEventListener("click", goHome);
homeLink.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goHome(); }
});
// The version link lives inside the clickable brand region — without this,
// opening the release notes would also fire goHome() via bubbling.
document.getElementById("version").addEventListener("click", e => e.stopPropagation());

const helpBtn = document.getElementById("help-btn");
const helpDropdown = document.getElementById("help-dropdown");
function closeHelpMenu() {
  helpDropdown.hidden = true;
  helpBtn.setAttribute("aria-expanded", "false");
}
helpBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (!helpDropdown.hidden) { closeHelpMenu(); return; }
  helpDropdown.hidden = false;
  helpBtn.setAttribute("aria-expanded", "true");
});
document.addEventListener("click", e => {
  if (!helpDropdown.hidden && !e.target.closest(".help-menu")) closeHelpMenu();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !helpDropdown.hidden) closeHelpMenu();
});

function checkForUpdate() {
  fetch("/api/update-check").then(r => r.json()).then(u => {
    const warnBox = document.getElementById("warnings");
    const existing = warnBox.querySelector(".update-banner");
    if (existing) existing.remove();
    if (!u.update_available || !u.release_url) return;
    const div = document.createElement("div");
    div.className = "warning update-banner";
    div.append(`A new version (v${u.latest_version}) is available — `);
    const link = document.createElement("a");
    link.href = u.release_url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "see what's new";
    div.appendChild(link);
    div.append(".");
    warnBox.appendChild(div);
  }).catch(() => {});   // best-effort; a failed check just means no banner
}

const VIDEO_VIEWS = ["daily", "yearly", "events"];
const TOP_LEVEL_VIEWS = ["forecast", "storage", "config"];

const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                     "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function makeVidItem(v) {
  const div = document.createElement("div");
  div.className = "vid-item";
  div.innerHTML = `<span>${v.label}</span><span class="size">${v.size_mb} MB</span>`;
  div.onclick = () => play(v, div);
  return div;
}

function renderList() {
  const list = state.videos.filter(v => v.camera === state.camera && v.type === state.type);
  const box = document.getElementById("sidebar");
  box.innerHTML = "";
  let firstEl = null;

  // Daily/event labels start with YYYY-MM-DD, so they group naturally by
  // year and month. Yearly labels are just a year — nothing to group.
  if (state.type === "yearly") {
    list.forEach(v => {
      const el = makeVidItem(v);
      firstEl = firstEl || el;
      box.appendChild(el);
    });
  } else {
    const now = new Date();
    const curYear = String(now.getFullYear());
    const curMonth = String(now.getMonth() + 1).padStart(2, "0");
    const groups = new Map();  // year -> Map(month -> videos[])
    list.forEach(v => {
      const m = v.label.match(/^(\d{4})-(\d{2})/);
      const year = m ? m[1] : "Other";
      const month = m ? m[2] : "00";
      if (!groups.has(year)) groups.set(year, new Map());
      const yearMap = groups.get(year);
      if (!yearMap.has(month)) yearMap.set(month, []);
      yearMap.get(month).push(v);
    });

    for (const year of groups.keys()) {
      const yearMap = groups.get(year);
      const yearCount = [...yearMap.values()].reduce((n, arr) => n + arr.length, 0);
      const yearEl = document.createElement("details");
      yearEl.className = "year-group";
      yearEl.open = year === curYear;
      yearEl.innerHTML = `<summary><span>${year}</span><span class="group-count">${yearCount}</span></summary>`;

      for (const month of yearMap.keys()) {
        const videos = yearMap.get(month);
        const monthEl = document.createElement("details");
        monthEl.className = "month-group";
        monthEl.open = year === curYear && month === curMonth;
        const monthName = month === "00" ? "Undated" : MONTH_NAMES[parseInt(month, 10) - 1];
        monthEl.innerHTML = `<summary><span>${monthName}</span><span class="group-count">${videos.length}</span></summary>`;
        videos.forEach(v => {
          const el = makeVidItem(v);
          firstEl = firstEl || el;
          monthEl.appendChild(el);
        });
        yearEl.appendChild(monthEl);
      }
      box.appendChild(yearEl);
    }
  }

  if (list.length) {
    play(list[0], firstEl);
  } else {
    document.getElementById("player-area").innerHTML =
      `<div id="empty">No ${state.type} videos yet${state.camera ? " for " + state.camera : ""}.<br>
       Run <code>build_timelapse.py</code> to create some.</div>`;
    state.current = null;
  }
}

function play(v, itemEl) {
  state.current = v;
  document.querySelectorAll(".vid-item").forEach(el => el.classList.remove("active"));
  if (itemEl) itemEl.classList.add("active");
  const area = document.getElementById("player-area");
  area.innerHTML = `
    <div class="video-wrap">
      <video controls autoplay muted src="${v.url}"></video>
      <div id="controls">
        <span class="label">${v.camera} &middot; ${v.label}</span>
        <span class="label">Speed:</span>
        ${[0.5, 1, 2, 4].map(s =>
          `<button class="speed${s === 1 ? " active" : ""}" data-speed="${s}">${s}&times;</button>`).join("")}
        <a class="dl" href="${v.url}" download>download</a>
        <button class="del" title="Delete this video from disk">delete</button>
      </div>
    </div>`;
  area.querySelectorAll(".speed").forEach(b => {
    b.onclick = () => {
      area.querySelector("video").playbackRate = parseFloat(b.dataset.speed);
      area.querySelectorAll(".speed").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    };
  });
  area.querySelector(".del").onclick = async () => {
    if (!confirm(`Delete ${v.camera} ${v.label} (${v.size_mb} MB) from disk?\n\n`
                 + deleteHint(v))) return;
    const url = `/api/videos/${encodeURIComponent(v.camera)}/${v.type}`
              + `/${encodeURIComponent(v.label)}.mp4`;
    let res, data;
    try {
      res = await fetch(url, {method: "DELETE"});
      data = await res.json();
    } catch (e) { alert("Delete failed: " + e); return; }
    if (res.status === 401) {
      alert("Deleting a video needs the Config-page passcode — open the Config tab and sign in first.");
      return;
    }
    if (data.error) { alert("Delete failed: " + data.error); return; }
    if (data.warning) alert(data.warning);
    state.videos = state.videos.filter(
      x => !(x.camera === v.camera && x.type === v.type && x.label === v.label));
    renderList();
  };
}

// What deleting each video type actually costs. The rules differ: yearly
// videos are always rebuildable (their frame archive is never pruned), daily
// and event videos only while their source snapshots survive
// storage.keep_snapshots_days.
function deleteHint(v) {
  if (v.type === "yearly") {
    return `You can rebuild it any time: build_timelapse.py yearly --year ${v.label} --force`;
  }
  const date = (v.label.match(/^\d{4}-\d{2}-\d{2}/) || [])[0];
  const cmd = v.type === "events"
    ? `build_timelapse.py events --date ${date} --camera ${v.camera}`
    : `build_timelapse.py daily --date ${date} --camera ${v.camera}`;
  return `Rebuildable with \`${cmd}\` only while that day's snapshot frames still exist. `
       + `Otherwise this is permanent.`;
}

function fmtGB(n) {
  return n >= 1 ? n.toFixed(2) + " GB" : Math.round(n * 1024) + " MB";
}

// --- Forecast tab ----------------------------------------------------------
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const FC_LABELS = {
  storm: "Thunderstorms", snow: "Snow",
  "full-moon": "Full moon", "blue-moon": "Blue moon",
  "harvest-moon": "Harvest moon", "blood-moon": "Blood moon",
  "lunar-eclipse": "Lunar eclipse",
};

// How each `agreement` value reads in plain English. These describe what the
// sources actually said — we deliberately don't collapse them into an invented
// "confidence: 73%" score, because that number would be ours, not the
// forecast's. Lead time is shown separately and speaks for itself.
const FC_AGREEMENT = {
  both: "Both forecasts agree",
  "open-meteo-only": "Open-Meteo only — the NWS forecast doesn't show it",
  "nws-only": "NWS only — Open-Meteo doesn't show it",
  "single-source": "One forecast only — beyond the NWS 7-day range",
};

function fcIsMoon(kind) { return kind !== "storm" && kind !== "snow"; }

function fcChip(ev) {
  const kindClass = ev.kind === "storm" ? "storm" : ev.kind === "snow" ? "snow" : "moon";
  const span = document.createElement("span");
  span.className = `fc-chip fc-chip-${kindClass}`;
  const label = FC_LABELS[ev.kind] || ev.kind;
  // Moon events carry no percentage on purpose — they're computed, not
  // predicted, so a probability would be a lie.
  span.innerHTML = ev.probability != null && !ev.certain
    ? `${label} <span class="pct">${ev.probability}%</span>`
    : label;
  return span;
}

function fcDayLabel(iso, leadDays) {
  // Parse as a plain local date — new Date("2026-08-09") would be parsed as
  // UTC midnight and can render as the previous day west of Greenwich.
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const when = leadDays === 0 ? "today" : leadDays === 1 ? "tomorrow" : `in ${leadDays} days`;
  return {
    label: `<b>${DAY_NAMES[date.getDay()]}</b> ${MONTH_NAMES[m - 1]} ${d}`,
    when,
  };
}

function fcEventDetail(ev) {
  const wrap = document.createElement("div");
  wrap.className = "fc-event";

  const head = document.createElement("div");
  head.className = "fc-event-head";
  head.textContent = ev.headline || FC_LABELS[ev.kind] || ev.kind;
  wrap.appendChild(head);

  if (ev.certain) {
    const line = document.createElement("div");
    line.className = "fc-certain";
    line.textContent = "Certain — calculated from orbital mechanics, not forecast";
    wrap.appendChild(line);
    return wrap;
  }

  if (ev.window) {
    const line = document.createElement("div");
    line.className = "fc-event-line";
    line.textContent = `Expected around ${ev.window}`;
    wrap.appendChild(line);
  }
  if (ev.detail) {
    const line = document.createElement("div");
    line.className = "fc-event-line";
    line.textContent = ev.detail;
    wrap.appendChild(line);
  }
  if (ev.peak_cape) {
    const line = document.createElement("div");
    line.className = "fc-event-line";
    line.textContent = `Peak instability ${ev.peak_cape} J/kg · peak gusts ${ev.peak_gust} km/h`;
    wrap.appendChild(line);
  }
  if (ev.probability != null) {
    const meter = document.createElement("div");
    meter.className = "fc-meter";
    meter.innerHTML = `<span style="width:${Math.max(2, Math.min(100, ev.probability))}%"></span>`;
    wrap.appendChild(meter);
    const line = document.createElement("div");
    line.className = "fc-event-line";
    line.textContent = `${ev.probability}% chance of precipitation`;
    wrap.appendChild(line);
  }
  const agree = document.createElement("div");
  agree.className = "fc-agree";
  agree.textContent = FC_AGREEMENT[ev.agreement] || "";
  wrap.appendChild(agree);
  return wrap;
}

async function renderForecast() {
  document.getElementById("sidebar").innerHTML = "";
  const area = document.getElementById("player-area");
  area.innerHTML = `<div id="empty">Loading forecast&hellip;</div>`;

  let data;
  try {
    const res = await fetch("/api/forecast");
    data = await res.json();
    if (data.error) throw new Error(data.error);
  } catch (err) {
    area.innerHTML = `<div id="empty">Forecast unavailable.<br>${err.message}</div>`;
    return;
  }

  const view = document.createElement("div");
  view.id = "forecast-view";

  const nDays = (data.days || []).length;
  const generated = data.generated_at
    ? new Date(data.generated_at).toLocaleString([], {month: "short", day: "numeric",
                                                     hour: "numeric", minute: "2-digit"})
    : "unknown";
  const head = document.createElement("div");
  head.className = "fc-head";
  head.innerHTML = `<div class="fc-title">Next ${nDays} days</div>
    <div class="fc-sub">${data.timezone || "local time"} &middot; updated ${generated}</div>`;
  view.appendChild(head);

  if (data.stale) {
    const note = document.createElement("div");
    note.className = "fc-note";
    note.textContent = `The weather services aren't responding right now, so this is the `
      + `last forecast that came through — about ${data.stale_minutes} minutes old.`;
    view.appendChild(note);
  }
  (data.warnings || []).forEach(w => {
    const note = document.createElement("div");
    note.className = "fc-note";
    note.textContent = w;
    view.appendChild(note);
  });

  const list = document.createElement("div");
  list.className = "fc-days";
  (data.days || []).forEach(day => {
    const {label, when} = fcDayLabel(day.date, day.lead_days);
    const leadClass = day.lead_days <= 2 ? "lead-near" : day.lead_days <= 6 ? "lead-mid" : "lead-far";

    if (!day.events.length) {
      const row = document.createElement("div");
      row.className = "fc-day quiet";
      row.innerHTML = `<span class="fc-date">${label}</span>
        <span class="fc-when">${when}</span>
        <span class="fc-nothing">nothing expected</span>`;
      list.appendChild(row);
      return;
    }

    const det = document.createElement("details");
    det.className = `fc-day ${leadClass}`;
    // Near-term days with something happening open by default — that's the
    // part you'd actually act on.
    det.open = day.lead_days <= 2;
    const summary = document.createElement("summary");
    summary.innerHTML = `<span class="fc-date">${label}</span><span class="fc-when">${when}</span>`;
    const chips = document.createElement("span");
    chips.className = "fc-chips";
    day.events.forEach(ev => chips.appendChild(fcChip(ev)));
    summary.appendChild(chips);
    det.appendChild(summary);

    const body = document.createElement("div");
    body.className = "fc-body";
    day.events.forEach(ev => body.appendChild(fcEventDetail(ev)));
    if (!day.nws_covered && day.events.some(e => !fcIsMoon(e.kind))) {
      const line = document.createElement("div");
      line.className = "fc-agree";
      line.textContent = "This far out only one forecast model reaches, so treat it as a heads-up "
        + "rather than a plan — it should firm up over the next few days.";
      body.appendChild(line);
    }
    det.appendChild(body);
    list.appendChild(det);
  });
  view.appendChild(list);

  if (data.next_full_moon) {
    const foot = document.createElement("div");
    foot.className = "fc-footnote";
    const [y, m, d] = data.next_full_moon.date.split("-").map(Number);
    foot.textContent = `Next full moon after this window: ${MONTH_NAMES[m - 1]} ${d}, `
      + `${data.next_full_moon.days_away} days past the last day shown.`;
    view.appendChild(foot);
  }

  area.innerHTML = "";
  area.appendChild(view);
}

async function renderStorage() {

      <code>storage_stats.py</code> manually).</div>`;
    return;
  }

  const s = data.system;
  const r = s.retention || {};
  const f = s.forecast || {};
  const b = s.build_time || {};

  const cards = [
    ["Disk used", `${s.disk_used_pct}%`, `${s.disk_free_gb} GB free of ${s.disk_total_gb} GB`],
    ["Snapshots (rolling)", fmtGB(s.snapshots_gb), `+${fmtGB(s.snapshots_gb_per_day)}/day`],
    [`Daily videos (${forever(r.daily_video_days) ? "kept forever" : r.daily_video_days + "d retention"})`,
     fmtGB(s.daily_video_gb_total), `+${fmtGB(s.daily_video_gb_per_day)}/day`],
    ["Yearly archive frames (always kept forever)", fmtGB(s.yearly_frames_gb), `+${fmtGB(s.yearly_gb_per_day)}/day`],
    ["Avg build time", b.avg_minutes != null ? `${b.avg_minutes} min` : "—",
     b.samples ? `last: ${(b.last_seconds / 60).toFixed(1)} min &middot; ${b.samples} build(s) tracked` : "no builds recorded yet"],
  ];

  const verdictText = {
    shortage: `Storage shortage: ${fmtGB(f.shortage_gb)} short`,
    excess: `Storage headroom: ${fmtGB(f.excess_gb)} to spare`,
    runway: `Storage runway: ${f.runway_label}`,
  }[f.verdict] || "Storage forecast unavailable";
  const boundedNote = f.growth_needed_gb > 0
    ? `Tiers with retention set still need ${fmtGB(f.growth_needed_gb)} more before reaching their ${fmtGB(f.bounded_ceiling_gb)} ceiling.`
    : `Tiers with retention set are already at their steady-state size (${fmtGB(f.bounded_ceiling_gb)}).`;
  const unboundedNote = f.unbounded_gb_per_day > 0
    ? `Everything without a retention limit — always including the yearly archive frames, by design — grows at ${fmtGB(f.unbounded_gb_per_day)}/day (${fmtGB(f.unbounded_gb_per_year)}/year).`
    : `Every other tier has a retention limit, so total usage stops growing once each reaches it.`;

  const retentionLine = `Retention: snapshots ${forever(r.snapshot_days) ? "forever" : r.snapshot_days + " days"}
    &middot; daily video ${forever(r.daily_video_days) ? "forever" : r.daily_video_days + " days"}
    &middot; yearly video ${forever(r.yearly_video_years) ? "forever" : r.yearly_video_years + " years"}
    &middot; events ${forever(r.events_video_days) ? "forever" : r.events_video_days + " days"}`;

  const camRows = Object.entries(data.cameras).map(([name, c]) => `
    <tr>
      <td>${name}</td>
      <td>${c.avg_snapshot_kb} KB</td>
      <td>${fmtGB(c.snapshots_gb_per_day)}/day</td>
      <td>${c.daily_video_avg_mb} MB/day</td>
      <td>${fmtGB(c.yearly_gb_per_day)}/day</td>
      <td>${c.events_count ? fmtGB(c.events_gb_total) : "—"}</td>
    </tr>`).join("");

  area.innerHTML = `
    <div id="storage-view">
      <div class="stat-cards">
        ${cards.map(([label, val, sub]) => `
          <div class="stat-card">
            <div class="stat-label">${label}</div>
            <div class="stat-value">${val}</div>
            <div class="stat-sub">${sub}</div>
          </div>`).join("")}
      </div>
      <div class="retention-line">${retentionLine}</div>
      <div class="forecast-banner forecast-${f.verdict || "runway"}">
        <div class="forecast-title">${verdictText}</div>
        <div class="forecast-detail">${boundedNote} ${unboundedNote}</div>
      </div>
      <table class="stat-table">
        <thead><tr>
          <th>Camera</th><th>Avg frame</th><th>Snapshots</th>
          <th>Daily video</th><th>Yearly archive</th><th>Events</th>
        </tr></thead>
        <tbody>${camRows}</tbody>
      </table>
      <div class="stat-footnote">Updated ${data.generated_at} &middot; refreshed after each nightly build</div>
    </div>`;
}
