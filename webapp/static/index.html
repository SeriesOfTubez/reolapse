async function renderConfig() {
  document.getElementById("sidebar").innerHTML = "";
  const area = document.getElementById("player-area");
  area.innerHTML = `<div id="empty">Loading configuration&hellip;</div>`;
  document.getElementById("cfg-footer").classList.remove("visible");

  // Is a passcode gate in front of the Config API? (Opt-in; if no passcode is
  // set the whole app stays open and this just reports enabled:false.)
  let auth = {enabled: false, authed: true};
  try { auth = await (await fetch("/api/auth")).json(); } catch (e) {}
  state.authEnabled = !!auth.enabled;
  state.authed = !!auth.authed;
  if (state.authEnabled && !state.authed) { renderLogin(area); return; }

  const res = await fetch("/api/config");
  if (res.status === 401) {   // session expired between the two calls
    state.authed = false;
    renderLogin(area);
    return;
  }
  const data = await res.json();
  if (data.error) {
    area.innerHTML = `<div id="empty">${data.error}</div>`;
    return;
  }
  state.configData = data.config;
  state.accentColors = data.accent_colors || Object.keys(ACCENT_HEX);
  state.passwordVars = data.password_vars || [];
  state.detectedTimezone = data.detected_timezone || null;
  renderConfigForm(area);
}

// Passcode gate shown when the Config API is locked. Keeps the save/restart
// footer hidden — nothing to save until you're in.
function renderLogin(area) {
  document.getElementById("cfg-footer").classList.remove("visible");
  const wrap = document.createElement("div");
  wrap.id = "cfg-view";
  const card = document.createElement("div");
  card.className = "cfg-section cfg-login";
  card.innerHTML = `<h3>Config page locked</h3>
    <div class="cfg-hint-block">This page can edit <code>config.yaml</code> and
    scan your network, so it's protected by a passcode. Video browsing stays
    open — only the Config tab is gated.</div>`;

  const row = document.createElement("div");
  row.className = "cfg-login-row";
  const input = document.createElement("input");
  input.type = "password";
  input.placeholder = "Passcode";
  input.autofocus = true;
  const btn = document.createElement("button");
  btn.className = "cfg-btn cfg-btn-primary";
  btn.textContent = "Unlock";
  const msg = document.createElement("div");
  msg.className = "cfg-msg";

  const submit = async () => {
    msg.className = "cfg-msg";
    msg.textContent = "Checking…";
    btn.disabled = true;
    try {
      const res = await fetch("/api/auth", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({passcode: input.value}),
      });
      const data = await res.json();
      if (res.ok) { renderConfig(); return; }
      msg.className = "cfg-msg error";
      msg.textContent = data.error || "Incorrect passcode.";
    } catch (e) {
      msg.className = "cfg-msg error";
      msg.textContent = "Login failed: " + e;
    }
    btn.disabled = false;
    input.select();
  };
  btn.onclick = submit;
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

  row.appendChild(input);
  row.appendChild(btn);
  card.appendChild(row);
  card.appendChild(msg);
  wrap.appendChild(card);
  area.innerHTML = "";
  area.appendChild(wrap);
  input.focus();
}

function cfgGet(path, dflt) {
  let obj = state.configData;
  for (const p of path.split(".")) {
    if (obj == null) return dflt;
    obj = obj[p];
  }
  return obj === undefined || obj === null ? dflt : obj;
}

function cfgSet(path, value) {
  const parts = path.split(".");
  let obj = state.configData;
  for (let i = 0; i < parts.length - 1; i++) {
    if (obj[parts[i]] == null || typeof obj[parts[i]] !== "object") obj[parts[i]] = {};
    obj = obj[parts[i]];
  }
  obj[parts[parts.length - 1]] = value;
}

// Removes a key entirely (vs. cfgSet(path, null), which would leave a dead
// "key: null" line in the saved config.yaml) — used by migrations that
// rename a key, so the old one doesn't linger.
function cfgDelete(path) {
  const parts = path.split(".");
  let obj = state.configData;
  for (let i = 0; i < parts.length - 1; i++) {
    if (obj[parts[i]] == null || typeof obj[parts[i]] !== "object") return;
    obj = obj[parts[i]];
  }
  delete obj[parts[parts.length - 1]];
}

function fieldRow(labelText, hintText, inputEl, colLayout) {
  const row = document.createElement("div");
  row.className = "cfg-row" + (colLayout ? " cfg-row-col" : "");
  const label = document.createElement("div");
  label.className = "cfg-label";
  label.innerHTML = hintText
    ? `${labelText}<span class="cfg-hint">${hintText}</span>`
    : labelText;
  row.appendChild(label);
  row.appendChild(inputEl);
  return row;
}

function textField(path, opts) {
  opts = opts || {};
  const input = document.createElement("input");
  input.type = "text";
  input.value = cfgGet(path, opts.default != null ? opts.default : "");
  if (opts.readonly) input.readOnly = true;
  if (opts.placeholder) input.placeholder = opts.placeholder;
  input.oninput = () => cfgSet(path, input.value);
  return input;
}

function numberField(path, opts) {
  opts = opts || {};
  const input = document.createElement("input");
  input.type = "number";
  if (opts.step) input.step = opts.step;
  if (opts.min != null) input.min = opts.min;
  if (opts.max != null) input.max = opts.max;
  input.value = cfgGet(path, opts.default != null ? opts.default : 0);
  input.oninput = () => cfgSet(path, input.value === "" ? null : parseFloat(input.value));
  return input;
}

function selectField(path, options, opts) {
  opts = opts || {};
  const select = document.createElement("select");
  const current = cfgGet(path, opts.default);
  options.forEach(value => {
    const o = document.createElement("option");
    o.value = value;
    o.textContent = value;
    if (value === current) o.selected = true;
    select.appendChild(o);
  });
  select.onchange = () => cfgSet(path, select.value);
  return select;
}

const X264_PRESETS = ["ultrafast", "superfast", "veryfast", "faster", "fast",
                      "medium", "slow", "slower", "veryslow"];

function checkboxField(path, opts) {
  opts = opts || {};
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = !!cfgGet(path, !!opts.default);
  input.onchange = () => cfgSet(path, input.checked);
  return input;
}

function tzOptions() {
  try { if (Intl.supportedValuesOf) return Intl.supportedValuesOf("timeZone"); } catch (e) {}
  return ["UTC", "America/New_York", "America/Chicago", "America/Denver",
          "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu",
          "America/Toronto", "America/Sao_Paulo", "Europe/London", "Europe/Paris",
          "Europe/Berlin", "Europe/Moscow", "Asia/Kolkata", "Asia/Shanghai",
          "Asia/Tokyo", "Australia/Sydney"];
}

// Auto by default (a disabled field showing the detected zone); tick to set a
// zone manually from a dropdown. Writes capture.timezone: "" = auto.
function timezoneField() {
  const wrap = document.createElement("div");
  wrap.className = "tz-field";
  const detected = state.detectedTimezone;

  const toggle = document.createElement("label");
  toggle.className = "tz-manual-toggle";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = !!cfgGet("capture.timezone", "");
  toggle.appendChild(cb);
  toggle.appendChild(document.createTextNode(" Set manually"));

  const control = document.createElement("div");
  control.className = "tz-control";

  function render() {
    control.innerHTML = "";
    if (cb.checked) {
      const preselect = cfgGet("capture.timezone", "") || detected || "UTC";
      const zones = tzOptions().slice();
      if (!zones.includes(preselect)) zones.unshift(preselect);
      const sel = document.createElement("select");
      zones.forEach(z => {
        const o = document.createElement("option");
        o.value = z; o.textContent = z;
        if (z === preselect) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => cfgSet("capture.timezone", sel.value);
      cfgSet("capture.timezone", preselect);
      control.appendChild(sel);
    } else {
      cfgSet("capture.timezone", "");
      const disp = document.createElement("input");
      disp.type = "text";
      disp.disabled = true;
      disp.value = detected ? `${detected}  (auto-detected)`
                            : "host system clock  (no location set)";
      control.appendChild(disp);
    }
  }
  cb.onchange = render;
  render();

  wrap.appendChild(toggle);
  wrap.appendChild(control);
  return wrap;
}

function extractVarName(value) {
  const m = /^\$\{([A-Za-z_][A-Za-z0-9_]*)\}$/.exec(value || "");
  return m ? m[1] : null;
}

function passwordField(path) {
  // Never shows or accepts a literal secret - only ${VAR_NAME} references.
  // The dropdown lists REOLINK_PASSWORD* variables this server already has
  // loaded from .env (names only; the actual values never reach the
  // browser). "Custom" covers a variable you haven't added to .env yet.
  const wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.gap = "4px";
  wrap.style.width = "100%";

  const current = cfgGet(path, "");
  const currentVar = extractVarName(current);
  const known = [...(state.passwordVars || [])];
  if (currentVar && !known.includes(currentVar)) known.push(currentVar);

  const select = document.createElement("select");
  known.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = "${" + name + "}";
    if (name === currentVar) opt.selected = true;
    select.appendChild(opt);
  });
  const customOpt = document.createElement("option");
  customOpt.value = "__custom__";
  customOpt.textContent = "Custom variable name…";
  if (!currentVar) customOpt.selected = true;
  select.appendChild(customOpt);

  const customInput = document.createElement("input");
  customInput.type = "text";
  customInput.placeholder = "REOLINK_PASSWORD_...";
  customInput.style.display = currentVar ? "none" : "block";
  if (!currentVar && current) customInput.value = current.replace(/^\$\{|\}$/g, "");

  select.onchange = () => {
    if (select.value === "__custom__") {
      customInput.style.display = "block";
      customInput.oninput();
    } else {
      customInput.style.display = "none";
      cfgSet(path, "${" + select.value + "}");
    }
  };
  customInput.oninput = () => {
    const name = customInput.value.trim();
    cfgSet(path, name ? "${" + name + "}" : "");
  };

  wrap.appendChild(select);
  wrap.appendChild(customInput);
  return wrap;
}

function tagCheckGroup(path, allTags) {
  const group = document.createElement("div");
  group.className = "cfg-check-group";
  const current = cfgGet(path, []) || [];
  allTags.forEach(tag => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = current.includes(tag);
    cb.onchange = () => {
      let arr = cfgGet(path, []) || [];
      arr = cb.checked ? [...new Set([...arr, tag])] : arr.filter(t => t !== tag);
      cfgSet(path, arr);
    };
    label.appendChild(cb);
    label.appendChild(document.createTextNode(tag));
    group.appendChild(label);
  });
  return group;
}

// App Settings / Cameras split. The tab bar and #cfg-tab-body shell are built
// once per Config page load; renderConfigTab() rebuilds just the body every
// time the active tab changes (or the underlying data does), so it's the one
// that gets called by tab clicks — never renderConfig(), which refetches
// GET /api/config and would silently discard unsaved edits.
const CONFIG_TABS = [["app", "App Settings"], ["cameras", "Cameras"]];

function renderConfigForm(area) {
  const wrap = document.createElement("div");
  wrap.id = "cfg-view";

  const tabBar = document.createElement("div");
  tabBar.className = "pills cfg-tabs";
  CONFIG_TABS.forEach(([key, label]) => {
    const btn = document.createElement("button");
    btn.className = "pill" + (state.configTab === key ? " active" : "");
    btn.dataset.tab = key;
    btn.textContent = label;
    btn.onclick = () => {
      state.configTab = key;
      tabBar.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      renderConfigTab();
    };
    tabBar.appendChild(btn);
  });
  wrap.appendChild(tabBar);

  const tabBody = document.createElement("div");
  tabBody.id = "cfg-tab-body";
  wrap.appendChild(tabBody);

  area.innerHTML = "";
  area.appendChild(wrap);

  renderConfigTab();

  // The save/restart bar lives in #cfg-footer, a flex sibling of #player-area
  // (not inside the scrolling content) so it's always visible at the bottom
  // without ever overlapping content as you scroll through a long form.
  const footer = document.getElementById("cfg-footer");
  footer.innerHTML = "";
  footer.classList.add("visible");

  const msg = document.createElement("span");
  msg.className = "cfg-msg";

  const saveBtn = document.createElement("button");
  saveBtn.className = "cfg-btn cfg-btn-primary";
  saveBtn.textContent = "Save config";
  saveBtn.onclick = async () => {
    msg.className = "cfg-msg";
    msg.textContent = "Saving…";
    try {
      const res = await fetch("/api/config", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(state.configData),
      });
      const data = await res.json();
      if (data.error) {
        msg.className = "cfg-msg error";
        msg.textContent = data.error + (data.problems ? ": " + data.problems.join("; ") : "");
      } else {
        msg.className = "cfg-msg ok";
        msg.textContent = data.note || "Saved.";
      }
    } catch (e) {
      msg.className = "cfg-msg error";
      msg.textContent = "Save failed: " + e;
    }
  };

  const restartBtn = document.createElement("button");
  restartBtn.className = "cfg-btn";
  restartBtn.textContent = "Restart services";
  restartBtn.title = "Restarts reolapse-capture and reolapse-web (systemd deployments only) "
    + "so saved changes take effect without a manual restart";
  restartBtn.onclick = async () => {
    if (!confirm("Restart the capture and web services now? The page will briefly disconnect.")) return;
    restartBtn.disabled = true;
    restartBtn.textContent = "Restarting…";
    msg.className = "cfg-msg";
    msg.textContent = "";
    try {
      const res = await fetch("/api/restart", {method: "POST"});
      const data = await res.json();
      if (data.error) {
        msg.className = "cfg-msg error";
        msg.textContent = data.error;
      } else {
        msg.className = "cfg-msg ok";
        msg.textContent = data.note || "Restarting…";
      }
    } catch (e) {
      // The web service restarting itself can drop this very connection -
      // that's the expected outcome here, not a failure.
      msg.className = "cfg-msg ok";
      msg.textContent = "Services restarting — reload the page in a few seconds.";
    }
    restartBtn.disabled = false;
    restartBtn.textContent = "Restart services";
  };

  footer.appendChild(saveBtn);
  footer.appendChild(restartBtn);
  footer.appendChild(msg);
}

// Rebuilds #cfg-tab-body for the active tab. Always a full rebuild rather
// than caching sections and toggling display — several sections (the
// per-camera hint text in particular) are computed from *global* config
// values at build time, so a card built before you edited, say, the global
// capture interval would keep showing the stale number until this runs
// again. Cheap: nine sections, no network. Safe: every field writes through
// to state.configData on input/change via cfgSet, so the DOM is never the
// source of truth and a rebuild can't lose an edit — only transient,
// non-field state (an in-progress network scan, a typed-but-unsubmitted
// passcode) resets, which is the correct tradeoff for both.
function renderConfigTab() {
  const body = document.getElementById("cfg-tab-body");
  body.innerHTML = "";
  if (state.configTab === "cameras") {
    body.appendChild(buildCamerasTab());
  } else {
    body.appendChild(buildCaptureSection());
    body.appendChild(buildStorageSection());
    body.appendChild(buildDailyVideoSection());
    body.appendChild(buildYearlySection());
    body.appendChild(buildEventsSection());
    body.appendChild(buildEventsVideoSection());
    body.appendChild(buildWebappSection());
    body.appendChild(buildSecuritySection());
  }
}

function buildSecuritySection() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  const enabled = state.authEnabled;
  sec.innerHTML = `<h3>Config page access</h3>
    <div class="cfg-hint-block">${enabled
      ? "A passcode is protecting this page and its network-scan / config-write "
        + "endpoints. Video browsing stays open to anyone on the LAN."
      : "This page can rewrite <code>config.yaml</code> and scan your network, "
        + "but is currently <strong>open to anyone on the LAN</strong>. Set a "
        + "passcode to gate it (video browsing stays open either way)."}
    The passcode is stored only as a salted hash in <code>config.yaml</code> —
    the value you type is never saved anywhere in the clear.</div>`;

  const msg = document.createElement("div");
  msg.className = "cfg-msg";

  const pwInput = document.createElement("input");
  pwInput.type = "password";
  pwInput.placeholder = enabled ? "New passcode" : "Passcode (min 4 chars)";
  pwInput.style.maxWidth = "220px";

  const post = async (payload, confirmText) => {
    if (confirmText && !confirm(confirmText)) return;
    msg.className = "cfg-msg";
    msg.textContent = "Working…";
    try {
      const res = await fetch("/api/auth/passcode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.className = "cfg-msg error";
        msg.textContent = data.error || "Failed.";
        return;
      }
      renderConfig();   // reflect the new locked/open state
    } catch (e) {
      msg.className = "cfg-msg error";
      msg.textContent = "Failed: " + e;
    }
  };

  const setBtn = document.createElement("button");
  setBtn.className = "cfg-btn cfg-btn-primary";
  setBtn.textContent = enabled ? "Change passcode" : "Set passcode";
  setBtn.onclick = () => {
    if (!pwInput.value || pwInput.value.length < 4) {
      msg.className = "cfg-msg error";
      msg.textContent = "Passcode must be at least 4 characters.";
      return;
    }
    post({passcode: pwInput.value},
         enabled ? "Change the passcode? All current sessions will be logged out." : null);
  };

  const row = document.createElement("div");
  row.className = "cfg-login-row";
  row.appendChild(pwInput);
  row.appendChild(setBtn);

  if (enabled) {
    const lockBtn = document.createElement("button");
    lockBtn.className = "cfg-btn";
    lockBtn.textContent = "Lock now";
    lockBtn.title = "Log out this browser; you'll need the passcode again to reopen Config.";
    lockBtn.onclick = async () => {
      try { await fetch("/api/auth/logout", {method: "POST"}); } catch (e) {}
      renderConfig();
    };
    const removeBtn = document.createElement("button");
    removeBtn.className = "cfg-btn cfg-btn-danger";
    removeBtn.textContent = "Remove passcode";
    removeBtn.title = "Disable the gate — the Config page becomes open to anyone on the LAN.";
    removeBtn.onclick = () => post({clear: true},
      "Remove the passcode? The Config page will be open to anyone on the LAN.");
    row.appendChild(lockBtn);
    row.appendChild(removeBtn);
  }

  sec.appendChild(row);
  sec.appendChild(msg);
  return sec;
}

// The Cameras tab: intro hint, a picker + "+ Add" side by side, the selected
// camera's card, then network discovery. Camera selection is by index, not
// name — config field paths are index-based (cameras.${i}.name) and names
// are user-editable and transiently non-unique (every "+ Add" starts a
// camera out named "new-camera"; validate_config only catches duplicates at
// save) — so state.configCameraIndex, not the camera's name, is the source
// of truth for which card is showing.
function buildCamerasTab() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  sec.innerHTML = `<h3>Cameras</h3>
    <div class="cfg-hint-block">Every camera's password is a reference to a
    variable in <code>.env</code>, never a literal value here. Use one
    <code>REOLINK_PASSWORD</code> for everything, or add more variables named
    <code>REOLINK_PASSWORD_&lt;anything&gt;</code> (e.g.
    <code>REOLINK_PASSWORD_NVR</code>, <code>REOLINK_PASSWORD_BACKYARD</code>)
    if your devices use different accounts — each camera below picks which
    one it uses.</div>`;

  const cams = state.configData.cameras || [];
  if (state.configCameraIndex > cams.length - 1) {
    state.configCameraIndex = Math.max(0, cams.length - 1);
  }

  const pickerRow = document.createElement("div");
  pickerRow.className = "cfg-camera-picker-row";
  pickerRow.appendChild(cameraPicker({
    id: "config-camera-select",
    ariaLabel: "Camera",
    cameras: cams.map((cam, i) => ({value: String(i), label: cam.name || `Camera ${i + 1}`})),
    selected: String(state.configCameraIndex),
    emptyLabel: "No cameras configured",
    onSelect: value => { state.configCameraIndex = parseInt(value, 10); renderConfigTab(); },
  }));

  const addBtn = document.createElement("button");
  addBtn.className = "cfg-btn";
  addBtn.textContent = "+ Add camera manually";
  addBtn.onclick = () => {
    if (!state.configData.cameras) state.configData.cameras = [];
    state.configData.cameras.push({
      name: "new-camera", host: "", channel: 0, username: "admin",
      password: "${REOLINK_PASSWORD}", https: true, verify_ssl: false,
    });
    state.configCameraIndex = state.configData.cameras.length - 1;
    renderConfigTab();
  };
  pickerRow.appendChild(addBtn);
  sec.appendChild(pickerRow);

  if (cams.length) {
    sec.appendChild(renderCameraCard(state.configCameraIndex));
  }

  sec.appendChild(buildDiscoverySection());
  return sec;
}

// One camera's editable card. Renaming a camera doesn't live-update the
// picker label above until the next re-render — same as the card's own
// header, which is equally static (title.textContent is set once here, not
// wired to the Name input's oninput).
function renderCameraCard(i) {
  const cams = state.configData.cameras || [];
  const cam = cams[i];

  const card = document.createElement("div");
  card.className = "cfg-camera-card";

  const head = document.createElement("div");
  head.className = "cfg-camera-head";
  const title = document.createElement("strong");
  title.textContent = cam.name || `Camera ${i + 1}`;
  const rm = document.createElement("button");
  rm.className = "cfg-btn cfg-btn-danger";
  rm.textContent = "Remove";
  rm.onclick = () => {
    cams.splice(i, 1);
    state.configCameraIndex = Math.max(0, Math.min(state.configCameraIndex, cams.length - 1));
    renderConfigTab();
  };
  head.appendChild(title);
  head.appendChild(rm);
  card.appendChild(head);

  card.appendChild(fieldRow("Name", "Used in folder and file names for this camera's snapshots and "
    + "videos (data/snapshots/<name>/...) — letters, digits, and dashes only, no spaces.",
    textField(`cameras.${i}.name`)));
  card.appendChild(fieldRow("Host", "The device ReoLapse talks to for this camera: either the camera's "
    + "own IP (full resolution, no NVR dependency), or your NVR's IP if you'd rather pull every camera "
    + "through one device and credential.", textField(`cameras.${i}.host`)));
  card.appendChild(fieldRow("Channel", "0 when Host above is the camera itself. When Host is an NVR, "
    + "this is that camera's channel number on it (check the NVR's own UI, or use Discover below).",
    numberField(`cameras.${i}.channel`, {default: 0})));
  card.appendChild(fieldRow("Username", "The login name for this camera/NVR account. A dedicated, "
    + "least-privilege account is safer than reusing your admin login.", textField(`cameras.${i}.username`)));
  card.appendChild(fieldRow("Password", "Which .env variable holds this camera's password. Add the real "
    + "value there — never here. Different cameras can use different variables if they don't share an "
    + "account.", passwordField(`cameras.${i}.password`), true));
  card.appendChild(fieldRow("HTTPS", "Talk to this device over HTTPS instead of plain HTTP. Current "
    + "Reolink firmware generally requires it.", checkboxField(`cameras.${i}.https`, {default: true})));
  card.appendChild(fieldRow("Verify SSL cert", "Checks the device's TLS certificate against trusted "
    + "authorities before trusting it. Leave this off — Reolink devices ship self-signed certificates, "
    + "which would otherwise always fail this check.",
    checkboxField(`cameras.${i}.verify_ssl`, {default: false})));

  card.appendChild(buildCameraScheduleSection(i));
  card.appendChild(buildCameraEventsSection(i));

  if (cam.ptz_home) {
    const hint = document.createElement("div");
    hint.className = "cfg-hint";
    hint.style.marginTop = "6px";
    hint.textContent = "This camera has a PTZ home-position quarantine configured "
      + "— not editable here yet; edit config.yaml directly to change it "
      + "(it will be preserved as-is when you save from this page).";
    card.appendChild(hint);
  }

  return card;
}

// Per-camera capture schedule. Each field falls back to the global setting, so
// the defaults shown here are the global ones — what this camera does today.
// Touching a field pins it for this camera only.
function buildCameraScheduleSection(i) {
  const gEnabled = cfgGet("capture.daylight_window.enabled", false);
  const gMode = cfgGet("capture.daylight_window.mode", "day");
  const gBuffer = cfgGet("capture.daylight_window.buffer_minutes", 0);
  const gInterval = cfgGet("capture.interval_seconds", 60);

  const box = document.createElement("div");
  box.className = "cfg-subsection";
  const heading = document.createElement("h4");
  heading.textContent = "Capture schedule";
  box.appendChild(heading);
  const intro = document.createElement("div");
  intro.className = "cfg-hint-block";
  intro.textContent = "These start out following the global capture settings. Change one and it "
    + "applies to this camera only — useful for pointing a single camera at the dark hours "
    + "(overnight wildlife, a moonrise) while the rest keep shooting daylight.";
  box.appendChild(intro);

  box.appendChild(fieldRow("Auto daylight window",
    "Capture around real sunrise/sunset for this camera instead of a fixed clock window. "
    + `Global setting is currently ${gEnabled ? "on" : "off"}.`,
    checkboxField(`cameras.${i}.daylight_window.enabled`, {default: gEnabled})));

  const modeRow = fieldRow("Window mode",
    "\"day\" captures during daylight; \"night\" captures the opposite — the dark hours only. "
    + "A night spans midnight and is saved as one continuous video (built automatically ~5 min "
    + "after this camera's dawn window closes), so night videos aren't cut off at midnight.",
    selectField(`cameras.${i}.daylight_window.mode`, ["day", "night"], {default: gMode}));
  box.appendChild(modeRow);

  const bufferRow = fieldRow("Daylight buffer (minutes)",
    "In day mode, widens the window by this many minutes each side (start before sunrise, stop "
    + "after sunset). In night mode it's the inverse — trims that much twilight off each end.",
    numberField(`cameras.${i}.daylight_window.buffer_minutes`, {default: gBuffer, min: 0}));
  box.appendChild(bufferRow);

  box.appendChild(fieldRow("Capture interval (seconds)",
    "How often to grab a frame from this camera. A night camera covering the dark hours adds "
    + "roughly as many hours again as a daytime one, so a slower interval here is the simplest "
    + `way to keep disk growth flat. Global setting is ${gInterval}s; minimum is 10s.`,
    numberField(`cameras.${i}.interval_seconds`, {default: gInterval, min: 10})));

  // Mode and buffer only mean anything while the daylight window is on.
  const syncVisibility = (on) => {
    modeRow.style.display = on ? "" : "none";
    bufferRow.style.display = on ? "" : "none";
  };
  syncVisibility(cfgGet(`cameras.${i}.daylight_window.enabled`, gEnabled));
  const toggle = box.querySelector('input[type="checkbox"]');
  if (toggle) toggle.addEventListener("change", () => syncVisibility(toggle.checked));

  return box;
}

// Per-camera opt-out from weather/lunar events. Kept out of the schedule
// section above because it isn't a schedule — it decides whether this camera
// reacts to events at all.
function buildCameraEventsSection(i) {
  const anyEvents = cfgGet("events.weather_enabled", false)
    || cfgGet("events.lunar_enabled", false)
    || cfgGet("events.season_enabled", false);
  const burstTags = cfgGet("events.burst_tags", []) || [];
  const tagList = burstTags.length ? burstTags.join(" or ") : "a burst";
  const gInclude = cfgGet("daily_video.include_events", false);

  const box = document.createElement("div");
  box.className = "cfg-subsection";
  const heading = document.createElement("h4");
  heading.textContent = "Weather events";
  box.appendChild(heading);

  if (!anyEvents) {
    const off = document.createElement("div");
    off.className = "cfg-hint-block";
    off.textContent = "No event tagging is switched on for this setup yet — see the Events "
      + "section further down this page. This setting takes effect once it is.";
    box.appendChild(off);
  }

  box.appendChild(fieldRow("Follow weather events",
    `On: this camera speeds up to the burst interval while a ${tagList} tag is active, and gets `
    + "its own event clip for each of those spans. Off: it ignores events entirely — it holds "
    + "its normal capture interval through the storm and no event clips are built from its "
    + "frames. Turn it off for a camera the weather isn't visible from — indoors, a doorway, a "
    + "tight framing — where the extra frames are just disk and the clip is a video of nothing "
    + "happening. Frames still get tagged either way, so the metadata stays complete.",
    checkboxField(`cameras.${i}.events_enabled`, {default: true})));

  const inclRow = fieldRow("Include event frames in daily video",
    "Overrides the global Daily video setting for this camera only. Off leaves this camera's "
    + `burst frames out of its daily video; on weaves them in. The global setting is currently `
    + `${gInclude ? "on" : "off"}, and this follows it until you touch this checkbox. Only `
    + "applies while Follow weather events above is on — a camera that ignores events never "
    + "captured anything extra to leave out.",
    checkboxField(`cameras.${i}.include_events_in_daily`, {default: gInclude}));
  box.appendChild(inclRow);

  // Meaningless while this camera ignores events — same pattern as the mode /
  // buffer rows in the Capture schedule section above.
  const eventsToggle = box.querySelector('input[type="checkbox"]');
  const syncVisibility = (on) => { inclRow.style.display = on ? "" : "none"; };
  syncVisibility(cfgGet(`cameras.${i}.events_enabled`, true));
  if (eventsToggle) eventsToggle.addEventListener("change", () => syncVisibility(eventsToggle.checked));

  return box;
}

function buildDiscoverySection() {
  const box = document.createElement("div");
  box.style.marginTop = "16px";
  box.style.borderTop = "1px solid var(--border)";
  box.style.paddingTop = "12px";
  box.innerHTML = `<div class="cfg-hint-block">Scan the local network for
    Reolink cameras/NVRs. This only probes devices — nothing is added to
    your config until you identify one with credentials and click Add.</div>`;

  const scanBtn = document.createElement("button");
  scanBtn.className = "cfg-btn";
  scanBtn.textContent = "Scan network";
  const results = document.createElement("div");
  results.className = "cfg-discover-list";

  scanBtn.onclick = async () => {
    scanBtn.disabled = true;
    scanBtn.textContent = "Scanning…";
    results.innerHTML = "";
    try {
      const res = await fetch("/api/discover", {
        method: "POST", headers: {"Content-Type": "application/json"}, body: "{}",
      });
      const data = await res.json();
      if (!data.found || !data.found.length) {
        results.innerHTML = `<div class="cfg-hint">No Reolink devices found on ${data.subnet}.0/24.</div>`;
      } else {
        data.found.forEach(dev => results.appendChild(buildDiscoveredDeviceItem(dev)));
      }
    } catch (e) {
      results.innerHTML = `<div class="cfg-hint">Scan failed: ${e}</div>`;
    }
    scanBtn.disabled = false;
    scanBtn.textContent = "Scan network";
  };

  box.appendChild(scanBtn);
  box.appendChild(results);
  return box;
}

function buildDiscoveredDeviceItem(dev) {
  const item = document.createElement("div");
  item.className = "cfg-discover-item";

  const row = document.createElement("div");
  row.className = "cfg-discover-row";
  const label = document.createElement("span");
  label.textContent = `${dev.ip} (${dev.https ? "https" : "http"})`;
  const expandBtn = document.createElement("button");
  expandBtn.className = "cfg-btn";
  expandBtn.textContent = "Identify & add";
  row.appendChild(label);
  row.appendChild(expandBtn);
  item.appendChild(row);

  const detail = document.createElement("div");
  detail.className = "cfg-discover-detail";
  const userInput = document.createElement("input");
  userInput.type = "text";
  userInput.placeholder = "username";
  const passInput = document.createElement("input");
  passInput.type = "password";
  passInput.placeholder = "password";
  detail.appendChild(userInput);
  detail.appendChild(passInput);

  const idBtn = document.createElement("button");
  idBtn.className = "cfg-btn";
  idBtn.textContent = "Identify";
  const idResult = document.createElement("div");
  idResult.style.marginTop = "8px";

  idBtn.onclick = async () => {
    const username = userInput.value, password = passInput.value;
    if (!username || !password) {
      idResult.innerHTML = `<div class="cfg-hint">Enter username and password first.</div>`;
      return;
    }
    idBtn.disabled = true;
    idBtn.textContent = "Identifying…";
    idResult.innerHTML = "";
    try {
      const res = await fetch("/api/discover/identify", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({host: dev.ip, username, password, https: dev.https}),
      });
      const data = await res.json();
      if (data.error) {
        idResult.innerHTML = `<div class="cfg-hint">${data.error}</div>`;
      } else {
        const infoLine = document.createElement("div");
        infoLine.className = "cfg-hint";
        infoLine.textContent = `${data.model || "Unknown model"} — ${data.name || dev.ip}`;
        idResult.appendChild(infoLine);
        const channels = (data.channels && data.channels.length)
          ? data.channels : [{channel: 0, name: data.name || dev.ip}];
        channels.forEach(ch => {
          const addBtn = document.createElement("button");
          addBtn.className = "cfg-btn cfg-btn-primary";
          addBtn.style.marginTop = "6px";
          addBtn.style.marginRight = "6px";
          addBtn.textContent = `Add ch.${ch.channel}${ch.name ? " (" + ch.name + ")" : ""}`;
          addBtn.onclick = () => {
            const slug = (ch.name || `cam-${dev.ip.split(".").pop()}`)
              .toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "");
            const varName = "REOLINK_PASSWORD_" + slug.toUpperCase().replace(/-/g, "_");
            if (!state.configData.cameras) state.configData.cameras = [];
            state.configData.cameras.push({
              name: slug || `cam-${dev.ip.split(".").pop()}`,
              host: dev.ip, channel: ch.channel, username,
              password: "${" + varName + "}",
              https: dev.https, verify_ssl: false,
            });
            state.configCameraIndex = state.configData.cameras.length - 1;
            renderConfigTab();
          };
          idResult.appendChild(addBtn);
        });
      }
    } catch (e) {
      idResult.innerHTML = `<div class="cfg-hint">Identify failed: ${e}</div>`;
    }
    idBtn.disabled = false;
    idBtn.textContent = "Identify";
  };
  detail.appendChild(idBtn);
  detail.appendChild(idResult);
  item.appendChild(detail);

  expandBtn.onclick = () => detail.classList.toggle("open");
  return item;
}

function buildCaptureSection() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  sec.innerHTML = `<h3>Capture</h3>`;
  sec.appendChild(fieldRow("Time zone", "Used for capture timing and day boundaries. Auto-detected from your "
    + "location (ZIP or latitude/longitude in Weather & astronomy below) by default. Tick \"Set manually\" to pick "

    timezoneField(), true));
  sec.appendChild(fieldRow("Interval (seconds)", "How often each camera grabs a snapshot. This is the biggest "
    + "lever on both video smoothness and disk use — 60s (one frame/minute) gives a ~48s daily video at 30fps; "
    + "halving it doubles frame count, storage, and video length alike. Minimum 10s — faster polling risks "
    + "overloading the camera/NVR.",
    numberField("capture.interval_seconds", {default: 60, min: 10})));
  sec.appendChild(fieldRow("Auto daylight window",
    "Instead of a fixed clock window, computes actual sunrise/sunset for your location each day and captures "

    + "this keeps those frames out of the timelapse. Overrides Start/End time below when on; needs a location "

    checkboxField("capture.daylight_window.enabled", {default: false})));
  sec.appendChild(fieldRow("Window mode",
    "With Auto daylight window on: \"day\" captures during daylight (the default); \"night\" captures the "
    + "opposite — the dark hours only. A night spans midnight and is saved as one continuous video (built "
    + "automatically ~5 min after the dawn window closes), so you get night-only timelapses that aren't cut off "

    selectField("capture.daylight_window.mode", ["day", "night"], {default: "day"})));
  sec.appendChild(fieldRow("Daylight buffer (minutes)",
    "In day mode, widens the window by this many minutes each side (start before sunrise, stop after sunset). "
    + "In night mode it's the inverse — trims that much twilight off each end of the night. Only matters when "
    + "Auto daylight window above is on.",
    numberField("capture.daylight_window.buffer_minutes", {default: 0})));
  sec.appendChild(fieldRow("Start time (HH:MM)", "Fixed daily start time for capture, e.g. \"05:30\". Empty "
    + "means capture all day. Ignored whenever Auto daylight window above is on.",
    textField("capture.start_time", {placeholder: "05:30"})));
  sec.appendChild(fieldRow("End time (HH:MM)", "Fixed daily stop time for capture, e.g. \"21:30\". Ignored "
    + "whenever Auto daylight window above is on.",
    textField("capture.end_time", {placeholder: "21:30"})));
  return sec;
}

function buildStorageSection() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  sec.innerHTML = `<h3>Storage</h3>`;
  sec.appendChild(fieldRow("Keep snapshots (days)",
    "How long to keep a day's raw snapshot images after its daily video has been built. Once a day's video "
    + "exists, its source frames are just disk space — this prunes them after the given number of days so "
    + "storage doesn't grow forever. 0 keeps every snapshot indefinitely.",
    numberField("storage.keep_snapshots_days", {default: 4})));
  return sec;
}

function buildDailyVideoSection() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  sec.innerHTML = `<h3>Daily video</h3>`;
  sec.appendChild(fieldRow("Include event frames",
    "While a storm or snow burst is active, capture speeds up to the burst interval, so those "
    + "minutes end up far denser than the rest of the day and the daily video crawls through them. "
    + "Off (the default) leaves frames captured inside an active burst out of the daily video — "
    + "they still get their own clip on the Events tab, still count toward the yearly video's "
    + "frame archive, and are still on disk. On weaves them into the daily video as before. "
    + "Individual cameras can override this under their Weather events section.",
    checkboxField("daily_video.include_events", {default: false})));
  sec.appendChild(fieldRow("Frame rate (fps)", "Playback speed of the rendered video, in frames per second. "
    + "Doesn't change how many snapshots are captured — just how quickly they play back. Higher fps means a "
    + "shorter, faster-paced video from the same day's frames.",
    numberField("daily_video.fps", {default: 30})));
  sec.appendChild(fieldRow("Quality (CRF)", "x264's Constant Rate Factor — the main video quality/file-size "
    + "knob, roughly logarithmic: lower numbers mean higher quality and bigger files, higher numbers mean more "
    + "compression artifacts and smaller files. There's no fixed unit; each step up or down roughly halves or "
    + "doubles the file size. 18-23 is the commonly recommended \"visually lossless to very good\" range for "
    + "x264 — 18 looks close to the source but costs more disk, 23 is noticeably more compressed but much "
    + "smaller. This project defaults to 20 as a middle ground.",
    numberField("daily_video.crf", {default: 20})));
  sec.appendChild(fieldRow("Encode preset", "x264's speed-vs-compression tradeoff during encoding. Slower "
    + "presets (toward veryslow) spend more CPU time finding a smaller file at the same Quality (CRF) above; "
    + "faster presets (toward ultrafast) encode quicker but produce a larger file for the same quality. This "
    + "only affects encode time and file size — not the frame rate or resolution of the result. \"medium\" is "
    + "ffmpeg's own default and a reasonable starting point.",
    selectField("daily_video.preset", X264_PRESETS, {default: "medium"})));
  sec.appendChild(fieldRow("Deflicker window", "Number of neighboring frames averaged together to smooth out "
    + "brightness flicker between snapshots (common with auto-exposure cameras, especially at dawn/dusk or in "
    + "changing cloud cover). Larger windows smooth more but can blur fast lighting changes; 0 disables "
    + "deflickering entirely.",
    numberField("daily_video.deflicker_size", {default: 10})));
  sec.appendChild(fieldRow("Max height (px)", "Downscales the video if the source snapshots are taller than "
    + "this, preserving aspect ratio — reduces file size and encode time for high-resolution cameras. 0 keeps "
    + "the original snapshot resolution untouched.",
    numberField("daily_video.max_height", {default: 0})));
  sec.appendChild(fieldRow("Retention (days)", "Deletes a camera's daily video this many days after its date. "
    + "Unlike snapshots, a pruned daily video can't be rebuilt later — by the time it's pruned, its source "
    + "frames are normally already gone too (see Keep snapshots above). 0 keeps every daily video forever.",
    numberField("daily_video.retention_days", {default: 0})));
  return sec;
}

function buildYearlySection() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  sec.innerHTML = `<h3>Yearly video</h3>`;

// A slider that maps named presets onto a group of raw config numbers. No
// new config key is stored for the choice itself — dragging the slider
// writes the preset's concrete numbers straight into the existing keys, and
// the slider's position is *derived* at every render by matching the current
// raw values against the preset table. A hand-edited config.yaml (or simply
// typing in one of the raw inputs below) that doesn't exactly match a tier
// renders as "Custom" rather than guessing the nearest one — the numbers in
// the file are what runs, and the preset table exists only in the browser.
//
// opts: {
//   title, intro,               // subsection heading + shared intro hint
//   presets: [{name, values: {"cfg.path": number, ...}}],  // Conservative -> Aggressive
//   describe: (values) => string,  // human-readable summary of a values object,
//                                  // e.g. "CAPE 800 J/kg · rain 0.1 mm · gusts 60 km/h"
//   rows: [{path, row}],        // each path's fieldRow() <div>, in any order
// }
// returns a .cfg-subsection: heading, intro, <input type="range">, a caption
// line, then the raw rows.
function sensitivityGroup(opts) {
  const box = document.createElement("div");
  box.className = "cfg-subsection";

  const heading = document.createElement("h4");
  heading.textContent = opts.title;
  box.appendChild(heading);

  if (opts.intro) {
    const intro = document.createElement("div");
    intro.className = "cfg-hint-block";
    intro.textContent = opts.intro;
    box.appendChild(intro);
  }

  // Balanced is the deterministic "no exact match" fallback position (never
  // a nearest-tier guess) and also supplies cfgGet()'s default for each path
  // — i.e. "the shipped default" a path reads as when the key is absent.
  const balancedIndex = opts.presets.findIndex(p => p.name === "Balanced");
  const paths = Object.keys(opts.presets[0].values);

  const slider = document.createElement("input");
  slider.type = "range";
  slider.className = "sensitivity-slider";
  slider.min = "0";
  slider.max = String(opts.presets.length - 1);
  slider.step = "1";
  box.appendChild(slider);

  const caption = document.createElement("div");
  caption.className = "sensitivity-caption";
  box.appendChild(caption);

  function currentValues() {
    const values = {};
    paths.forEach(path => {
      values[path] = cfgGet(path, opts.presets[balancedIndex].values[path]);
    });
    return values;
  }

  function matchPreset() {
    const values = currentValues();
    const idx = opts.presets.findIndex(preset =>
      paths.every(path => Math.abs(Number(values[path]) - preset.values[path]) < 1e-9));
    if (idx >= 0) {
      slider.value = String(idx);
      caption.textContent = `${opts.presets[idx].name} — ${opts.describe(opts.presets[idx].values)}`;
      box.classList.remove("is-custom");
    } else {
      slider.value = String(balancedIndex);
      caption.textContent = `Custom — ${opts.describe(values)}`;
      box.classList.add("is-custom");
    }
  }

  slider.onchange = () => {
    const preset = opts.presets[parseInt(slider.value, 10)];
    paths.forEach(path => {
      cfgSet(path, preset.values[path]);
      const rowInfo = opts.rows.find(r => r.path === path);
      const input = rowInfo && rowInfo.row.querySelector("input");
      if (input) input.value = preset.values[path];
    });
    matchPreset();
  };

  opts.rows.forEach(r => {
    box.appendChild(r.row);
    const input = r.row.querySelector("input");
    if (input) input.addEventListener("input", matchPreset);
  });

  matchPreset();
  return box;
}

function buildEventsSection() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  sec.innerHTML = `<h3>Weather &amp; astronomy tagging</h3>`;

  sec.appendChild(fieldRow("Storm/snow/rain tagging", "Polls NWS alerts (US only) and Open-Meteo for active "
    + "storm/snow/rain conditions, tags matching frames, and can switch capture to the faster Burst interval "
    + "below while a Burst tag is active. Requires a location (ZIP or lat/lon, set below) — if left on without "
    + "one, this tagging is silently skipped and a warning is logged.",
    checkboxField("events.weather_enabled", {default: false})));
  sec.appendChild(fieldRow("Moon event tagging", "Computes real moon events locally (via Skyfield): full, "
    + "blue, and harvest moon, plus blood moon (total lunar eclipse) and partial lunar eclipse. No location "
    + "required — moon phase is the same instant everywhere on Earth; a location is only used to skip tagging "
    + "an eclipse when the Moon isn't actually above your horizon. First use downloads a ~17 MB ephemeris file.",
    checkboxField("events.lunar_enabled", {default: false})));
  sec.appendChild(fieldRow("Season tagging", "Tags every frame and video with the current astronomical season "
    + "(spring/summer/fall/winter). No location required — defaults to Northern Hemisphere; set a location "
    + "below to get correct seasons south of the equator.",
    checkboxField("events.season_enabled", {default: false})));

  const hasLatLon = cfgGet("events.latitude", null) != null;
  const modeRow = document.createElement("div");
  modeRow.className = "cfg-row cfg-row-col";
  const modeLabel = document.createElement("div");
  modeLabel.className = "cfg-label";
  modeLabel.textContent = "Location";
  const radioGroup = document.createElement("div");
  radioGroup.className = "cfg-radio-group";
  const zipRadioLabel = document.createElement("label");
  const zipRadio = document.createElement("input");
  zipRadio.type = "radio"; zipRadio.name = "locmode"; zipRadio.value = "zip";
  zipRadio.checked = !hasLatLon;
  zipRadioLabel.appendChild(zipRadio);
  zipRadioLabel.appendChild(document.createTextNode(" US ZIP code"));
  const latRadioLabel = document.createElement("label");
  const latRadio = document.createElement("input");
  latRadio.type = "radio"; latRadio.name = "locmode"; latRadio.value = "latlon";
  latRadio.checked = hasLatLon;
  latRadioLabel.appendChild(latRadio);
  latRadioLabel.appendChild(document.createTextNode(" Latitude/longitude"));
  radioGroup.appendChild(zipRadioLabel);
  radioGroup.appendChild(latRadioLabel);
  modeRow.appendChild(modeLabel);
  modeRow.appendChild(radioGroup);
  sec.appendChild(modeRow);

  const zipRow = fieldRow("ZIP code", "US ZIP code, resolved to latitude/longitude via zippopotam.us (free, "
    + "no API key). Used by Storm/snow/rain tagging (required), and optionally by Moon event and Season "
    + "tagging above and Auto daylight window in Capture.",
    textField("events.zip", {placeholder: "12345"}));
  const latRow = fieldRow("Latitude", "Decimal degrees (e.g. 38.7906). Use this instead of ZIP code if you're "
    + "outside the US, or want to skip the ZIP lookup.", numberField("events.latitude", {step: "0.0001"}));
  const lonRow = fieldRow("Longitude", "Decimal degrees (e.g. -89.8339). Paired with Latitude above.",
    numberField("events.longitude", {step: "0.0001"}));
  zipRow.style.display = hasLatLon ? "none" : "flex";
  latRow.style.display = hasLatLon ? "flex" : "none";
  lonRow.style.display = hasLatLon ? "flex" : "none";
  sec.appendChild(zipRow);
  sec.appendChild(latRow);
  sec.appendChild(lonRow);

  zipRadio.onchange = () => {
    if (!zipRadio.checked) return;
    zipRow.style.display = "flex"; latRow.style.display = "none"; lonRow.style.display = "none";
    cfgSet("events.latitude", null);
    cfgSet("events.longitude", null);
  };
  latRadio.onchange = () => {
    if (!latRadio.checked) return;
    zipRow.style.display = "none"; latRow.style.display = "flex"; lonRow.style.display = "flex";
    cfgSet("events.zip", null);
  };

  sec.appendChild(fieldRow("Poll interval (minutes)", "How often to check NWS alerts and Open-Meteo for "
    + "current weather conditions. Only relevant when Storm/snow/rain tagging above is on.",

  sec.appendChild(fieldRow("Burst interval (seconds)", "Capture interval used instead of the normal "

    + "— e.g. capture more frequently during an actual storm so the event clip (see Event video clips below) "

    tagCheckGroup("events.burst_tags", ["storm", "snow", "rain"]), true));

  // Shared limitation for both sliders below, stated once rather than in

  const capeRow = fieldRow("Convective energy (CAPE, J/kg)",

    numberField("events.storm_gust_kmh", {default: 60, min: 0}));

  const tuning = sensitivityGroup({
    title: "Storm detection tuning",
    intro: "Weather services report \"thunderstorm\" far less often than thunderstorms actually happen — a "
      + "storm downpour usually comes back labelled as rain showers. So a storm is also inferred from the "

    presets: STORM_SENSITIVITY_PRESETS,
    describe: v => `CAPE ${v["events.storm_cape_min"]} J/kg · rain ${v["events.storm_precip_mm"]} mm · `
      + `gusts ${v["events.storm_gust_kmh"]} km/h`,
    rows: [
      {path: "events.storm_cape_min", row: capeRow},
      {path: "events.storm_precip_mm", row: precipRow},
      {path: "events.storm_gust_kmh", row: gustRow},
    ],
  });
  tuning.appendChild(fieldRow("Outage grace (minutes)",
    "If a weather service stops responding — these free APIs hand out timeouts and 503s fairly regularly — "
    + "keep its last known tags for this long instead of treating the outage as \"all clear\". Without it, a "
    + "single failed check ends a storm burst early. Set 0 to disable. Not part of the tiers above — this is "
    + "an outage policy, not a sensitivity.",
    numberField("events.stale_grace_minutes", {default: 15, min: 0})));
  sec.appendChild(tuning);

  const snowRow = fieldRow("Minimum snowfall (cm)",
    "cm in the reporting interval before live snow tagging fires — deliberately the same \"in the reporting "
    + "interval\" phrasing as Minimum rainfall above, and NOT the same unit as the Forecast tab's Minimum "
    + "snow (cm) below, which accumulates across a whole day. At 0 (the default), any Open-Meteo snow code or "
    + "any measurable snowfall at all tags snow — the same behavior as today, plus catching measurable "
    + "snowfall reported with no snow code.",
    numberField("events.snow_cm_min", {default: 0.0, min: 0, step: "0.1"}));

  const snowGroup = sensitivityGroup({
    title: "Snow detection tuning",
    intro: "Same idea as storm detection above, for live snow tagging. Raise it to require an actual "
      + "snowfall rate instead of a bare snow code or trace amount.",
    presets: SNOW_SENSITIVITY_PRESETS,
    describe: v => `snow ${v["events.snow_cm_min"]} cm`,
    rows: [
      {path: "events.snow_cm_min", row: snowRow},
    ],
  });
  sec.appendChild(snowGroup);

  const fc = document.createElement("div");
  fc.className = "cfg-subsection";
  const fh = document.createElement("h4");
  fh.textContent = "Forecast tab";
  fc.appendChild(fh);
  const fintro = document.createElement("div");

    + "forecast storm too, so what it predicts matches what actually gets tagged.";
  fc.appendChild(fintro);

  fc.appendChild(fieldRow("Days ahead",
    "How far ahead to look, up to 10. Open-Meteo forecasts 10 days out; the US National Weather "

    "How much snow has to be expected across a day before it's worth showing. A dusting that melts "
    + "on contact makes a dull timelapse; the default is roughly \"you can see it settling\".",
    numberField("events.forecast_snow_cm_min", {default: 0.5, min: 0, step: "0.1"})));

  return sec;

function buildEventsVideoSection() {
  const sec = document.createElement("div");
  sec.className = "cfg-section";
  sec.innerHTML = `<h3>Event video clips</h3>`;
  sec.appendChild(fieldRow("Tags that get their own clip", "Each night, any contiguous span of frames sharing "
    + "one of these active tags gets rendered into its own short clip (separate from the daily/yearly videos) "
    + "— e.g. a dedicated video for each storm. Any tag works here, including moon phases and seasons, not "
    + "just weather.",
    tagCheckGroup("events_video.tags", EVENT_TAGS), true));
  // min_frames -> min_seconds migration: a config.yaml written before this
  // rename only has min_frames, which is still honored (see
  // common.event_min_frames) but is invisible in this UI's own units. Same
  // pattern as timezoneField()'s auto-migration and the location radios
  // nulling out lat/lon — mutate state.configData in place at render time,
  // before the user does anything, so what's on screen matches what a Save
  // would actually write.
  if (cfgGet("events_video.min_seconds", null) == null && cfgGet("events_video.min_frames", null) != null) {
    const fps = cfgGet("events_video.fps", 30) || 30;
    const minFrames = cfgGet("events_video.min_frames", 30);
    cfgSet("events_video.min_seconds", Math.round((minFrames / fps) * 10) / 10);
    cfgDelete("events_video.min_frames");
  }
  sec.appendChild(fieldRow("Minimum clip length (seconds)",
    "Every tagged span still gets a clip, even a brief one (e.g. a storm alert that clears in a couple of "
    + "minutes) — but a clip shorter than this gets padded out with extra frames from before/after the event "
    + "so it's never just a blink-and-you-miss-it couple of frames. Converted to a frame count using Frame "
    + "rate (fps) below.",
    numberField("events_video.min_seconds", {default: 5, min: 0, step: "0.5"})));
  sec.appendChild(fieldRow("Merge gap (minutes)",
    "Two spans of the same tag separated by less than this are rendered as one clip instead of two — a "
    + "storm that briefly drops below threshold and comes right back still gets a single continuous video. "
    + "The same gap also decides which frames are held out of the daily video when Daily video > Include "
    + "event frames is off, so the two always agree on where one event ends and the next begins. Per-tag "
    + "overrides aren't editable in this UI — set events_video.gap_minutes_by_tag directly in config.yaml "

    numberField("events_video.gap_minutes", {default: 20, min: 0})));
  sec.appendChild(fieldRow("Frame rate (fps)", "Playback speed of event clips, in frames per second — same "
    + "idea as Daily video's Frame rate.", numberField("events_video.fps", {default: 30})));
  sec.appendChild(fieldRow("Quality (CRF)", "x264 quality for event clips — same scale as Daily video's "
    + "Quality (CRF): lower is higher quality and bigger file, higher is more compressed and smaller.",
    numberField("events_video.crf", {default: 20})));
  sec.appendChild(fieldRow("Encode preset", "x264 encode speed vs. compression for event clips — same "
    + "tradeoff as Daily video's Encode preset.",
    selectField("events_video.preset", X264_PRESETS, {default: "medium"})));
  sec.appendChild(fieldRow("Deflicker window",
    "Frames averaged to smooth exposure flicker in event clips. Defaults to 0 (off) here specifically because "
    + "deflickering would smooth away lightning flashes in storm clips — turning it on for a tag without that "
    + "concern (e.g. snow) can look better. Per-tag overrides aren't editable in this UI — set "
    + "events_video.deflicker_by_tag directly in config.yaml.",

  sec.appendChild(fieldRow("Retention (days)", "Deletes an event clip this many days after the date in its "

// Poll for video-build activity and show a header indicator while a build runs.
let _lastBuildState = null;
async function pollBuildStatus() {
  const el = document.getElementById("build-indicator");
  if (!el) return;
  try {
    const s = await (await fetch("/api/build-status")).json();
    const running = s.state === "running";
    if (running) {
      const kind = s.kind ? s.kind + " " : "";
      el.innerHTML = `<span class="build-spin"></span> Building ${kind}videos…`;
      el.hidden = false;
    } else {
      el.hidden = true;
    }
    // A build just finished — refresh the video list so the new one shows up
    // (skip while the user is on the Config page to avoid interrupting edits).
    if (_lastBuildState === "running" && !running && state.type !== "config") {
      load();
    }
    _lastBuildState = s.state;
  } catch (e) { /* transient; try again next tick */ }
}
setInterval(pollBuildStatus, 8000);

load();
pollBuildStatus();
</script>
